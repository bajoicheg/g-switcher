title = "G-switcher secret scanning"
[extend]
useDefault = true

# Preserve every default detector. Only two documented keyboard chords in two
# documentation files are known false positives of the generic credential rule.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Documented keyboard shortcuts, not credentials"
condition = "AND"
paths = ['''(^|/)docs/(FUNCTIONAL_SPEC|ACCEPTANCE_TESTS)\.md$''']
regexTarget = "secret"
regexes = ['''^Ctrl\+Shift\+F(10|12)$''']
