name: War and Peace per-volume audit

on:
  push:
    branches: [audit/war-and-peace-full-1.0.7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add per-volume War and Peace audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Extract four volumes and epilogue
        shell: bash
        run: |
          python - <<'PY'
          import io
          import pathlib
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET

          url='https://tolstoy.ru/upload/wap/War_and_Peace.docx'
          req=urllib.request.Request(url,headers={'User-Agent':'G-switcher-volume-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=r.read()
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              root=ET.fromstring(zf.read('word/document.xml'))
          paras=[]
          for idx,p in enumerate(root.findall('.//w:body/w:p',ns)):
              text=''.join((n.text or '') for n in p.findall('.//w:t',ns))
              style=None
              ppr=p.find('w:pPr',ns)
              if ppr is not None:
                  ps=ppr.find('w:pStyle',ns)
                  if ps is not None:
                      style=ps.attrib.get('{%s}val'%ns['w'])
              paras.append((idx,style,text))

          starts={}
          epilogue=None
          end=None
          for idx,style,text in paras:
              if style=='Heading2' and text in {'ТОМ ПЕРВЫЙ','ТОМ ВТОРОЙ','ТОМ ТРЕТИЙ','ТОМ ЧЕТВЕРТЫЙ'}:
                  starts[text]=idx
              if starts.get('ТОМ ЧЕТВЕРТЫЙ') is not None and epilogue is None and style=='Heading3' and text.strip()=='ЭПИЛОГ.':
                  epilogue=idx
              if starts.get('ТОМ ПЕРВЫЙ') is not None and style=='Heading1' and text.startswith('ПЕЧАТНЫЕ ВАРИАНТЫ'):
                  end=idx
                  break
          expected={'ТОМ ПЕРВЫЙ':452,'ТОМ ВТОРОЙ':4278,'ТОМ ТРЕТИЙ':7745,'ТОМ ЧЕТВЕРТЫЙ':11302}
          if starts != expected or epilogue != 13397 or end != 14260:
              raise RuntimeError(f'unexpected boundaries: {starts}, epilogue={epilogue}, end={end}')
          bounds=[452,4278,7745,11302,14260]
          out=pathlib.Path('audit-corpus'); out.mkdir(exist_ok=True)
          for n,(a,b) in enumerate(zip(bounds,bounds[1:]),start=1):
              text='\n'.join(t for idx,s,t in paras if a<=idx<b)
              (out/f'volume{n}.txt').write_text(text,encoding='utf-8')
              print(f'volume{n}: paragraphs={b-a} chars={len(text)}')
          ep='\n'.join(t for idx,s,t in paras if epilogue<=idx<end)
          (out/'epilogue.txt').write_text(ep,encoding='utf-8')
          print(f'epilogue: paragraphs={end-epilogue} chars={len(ep)}')
          PY

      - name: Build audit executable once
        shell: bash
        run: cargo build --release --quiet --example war_and_peace_audit

      - name: Audit each range
        shell: bash
        run: |
          set -euo pipefail
          for name in volume1 volume2 volume3 volume4 epilogue; do
            rm -rf audit-output
            target/release/examples/war_and_peace_audit audit-corpus/${name}.txt
            mv audit-output audit-output-${name}
            echo "=== ${name} ==="
            cat audit-output-${name}/summary.txt
          done

      - name: Upload per-volume reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: war-and-peace-per-volume-audit
          path: audit-output-*/
          retention-days: 30
          if-no-files-found: error
