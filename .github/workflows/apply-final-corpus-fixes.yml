name: Apply final Wikipedia corpus fixes

on:
  push:
    branches: [audit/wikipedia-five-1.0.5]
    paths: [.github/workflows/apply-final-corpus-fixes.yml]

permissions:
  contents: write

# Final one-shot gate for the three non-colliding residual forms.
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-five-1.0.5
          fetch-depth: 0

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Add final safe forms and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/frequency_model.rs')
          text = model.read_text(encoding='utf-8')
          old = 'эйнштейн эйнштейна якутскую ",\n'
          new = 'эйнштейн эйнштейна якутскую нефти наук сфер ",\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('final RU_COMMON insertion point not found')
              model.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/wikipedia_five_regressions.rs')
          text = tests.read_text(encoding='utf-8')
          old = '    "якутскую",\n];\n'
          new = '    "якутскую",\n    "нефти",\n    "наук",\n    "сфер",\n];\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('regression insertion point not found')
              tests.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --all-targets

      - name: Commit validated final forms
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add src/frequency_model.rs tests/wikipedia_five_regressions.rs
          git diff --cached --check
          git commit -m 'Close final safe Wikipedia corpus misses for 1.0.5'
          git push origin HEAD:audit/wikipedia-five-1.0.5
