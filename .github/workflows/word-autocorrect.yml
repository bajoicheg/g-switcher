name: G-switcher Word AutoCorrect capitalization and no repeated probing
'on':
  push:
    branches:
    - cdc/word-autocorrect-20261008-2adee607
permissions:
  contents: read
concurrency:
  group: g-switcher-word-native-adapter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.managed.outputs.candidate_sha }}
    steps:
    - name: Checkout exact immutable orchestration
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: orchestration
        persist-credentials: false
    - name: Checkout pinned product for managed ownership
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: product
        ref: 211a919a9db5dedaab84b22684c7c942d93133e5
        fetch-depth: 0
        persist-credentials: true
    - name: Validator dependency
      run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
    - name: Prepare Rust checks and Windows cross target
      working-directory: product
      run: 'rustup target add --toolchain 1.98.1 x86_64-pc-windows-gnu

        rustc --version

        cargo --version'
    - name: Execute canonical managed task
      id: managed
      env:
        CDC_REPO_ROOT: ${{ github.workspace }}/product
        CDC_WORKER_PATH: ${{ github.workspace }}/orchestration/.g-switcher-fix/worker.py
        CDC_PAYLOAD_SHA256: 2adee607877891404e908ce2abc715bd562ffbbcf4a9dc4f0390132d52476074
        CDC_WRITE_PATHS_JSON: '["src/windows_runtime_v201.rs", "src/windows_runtime/selection.rs",
          "src/windows_runtime/word_native.rs", "src/windows_runtime/word_auto_correct.rs",
          "docs/work-status/word-autocorrect-2026-10-08.json"]'
        CDC_TASK_ID: word-autocorrect
        CDC_EXPECTED_OUTPUTS_JSON: '["out:word-native-product-candidate"]'
        CDC_EXPECTED_EVIDENCE_JSON: '["evidence:pinned-payload-and-worker-checks"]'
        PYTHONPYCACHEPREFIX: ${{ runner.temp }}/cdc-bytecode
      run: python -B orchestration/.g-switcher-fix/runner.py
    - name: Preserve exact managed runtime and release evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: g-switcher-word-native-managed-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '${{ runner.temp }}/cdc-word-native-${{ github.run_id }}-${{ github.run_attempt
          }}/protocol

          ${{ runner.temp }}/cdc-word-native-${{ github.run_id }}-${{ github.run_attempt
          }}/handles

          ${{ runner.temp }}/cdc-word-native-${{ github.run_id }}-${{ github.run_attempt
          }}/journal

          ${{ runner.temp }}/cdc-word-native-${{ github.run_id }}-${{ github.run_attempt
          }}/worker-evidence'
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.managed.outputs.candidate_sha }}
        persist-credentials: false
    - name: Verify exact source revision before building
      env:
        EXPECTED_SOURCE_SHA: ${{ needs.managed.outputs.candidate_sha }}
      run: python scripts/verify_build_revision.py --require-clean
    - name: Source provenance regression tests
      run: python -m unittest discover -s scripts -p 'test_build_revision.py' -v
    - name: Rust toolchain
      shell: pwsh
      run: "rustup toolchain install 1.98.1 --profile minimal --component rustfmt\
        \ --component clippy\nrustup override set 1.98.1\n$active = rustup show active-toolchain\n\
        Write-Host $active\nif (-not $active.StartsWith('1.98.1')) {\n  throw \"Unexpected\
        \ Rust toolchain: $active\"\n}\nrustc --version\ncargo --version\n"
    - name: Read-only 2.0.1 source and privacy gate
      shell: pwsh
      run: ./scripts/ci-normalize-v201.ps1
    - name: Format
      shell: pwsh
      run: cargo fmt --all -- --check
    - name: Locked dependency graph
      shell: pwsh
      run: cargo metadata --locked --no-deps --format-version 1 > $null
    - name: Clippy
      shell: pwsh
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Unit tests
      shell: pwsh
      run: cargo test --locked --all-targets
    - name: Build compiled compatibility tool
      shell: pwsh
      run: cargo build --locked --bin g-switcher-compatibility
    - name: Manual compatibility tooling smoke test
      shell: pwsh
      run: "$windowsPowerShell = Join-Path $env:SystemRoot 'System32\\WindowsPowerShell\\\
        v1.0\\powershell.exe'\nif (-not (Test-Path -LiteralPath $windowsPowerShell\
        \ -PathType Leaf)) {\n  throw 'Windows PowerShell 5.1 executable is missing\
        \ from the runner.'\n}\n\n# Keep the legacy developer recorder compatible\
        \ with Windows PowerShell\n# 5.1, but human testing no longer depends on unsigned\
        \ script execution.\n$recorderBytes = [System.IO.File]::ReadAllBytes('scripts/manual-compatibility-v201.ps1')\n\
        if (@($recorderBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {\n  throw\
        \ 'manual-compatibility-v201.ps1 must remain ASCII-only for Windows PowerShell\
        \ 5.1 compatibility.'\n}\n\n$output = Join-Path $env:RUNNER_TEMP \"compatibility-results-2.0.1.md\"\
        \n& $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\\
        manual-compatibility-v201.ps1 -ScaffoldOnly -OutputPath $output\nif ($LASTEXITCODE\
        \ -ne 0) {\n  throw \"Windows PowerShell 5.1 recorder smoke test failed with\
        \ exit code $LASTEXITCODE.\"\n}\nif (-not (Test-Path -LiteralPath $output\
        \ -PathType Leaf)) {\n  throw 'Manual compatibility recorder did not create\
        \ its result file.'\n}\n$text = Get-Content -LiteralPath $output -Raw\nif\
        \ ($text -notmatch '## Manual application matrix' -or $text -notmatch 'Notepad'\
        \ -or $text -notmatch 'Windows Terminal' -or $text -notmatch 'PENDING') {\n\
        \  throw 'Manual compatibility recorder produced an incomplete scaffold.'\n\
        }\n\n& $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\\
        verify-compatibility-v201.ps1 -Path $output\nif ($LASTEXITCODE -eq 0) {\n\
        \  throw 'PowerShell compatibility verifier unexpectedly accepted a PENDING\
        \ scaffold.'\n}\n$global:LASTEXITCODE = 0\n\n$compiledScaffold = Join-Path\
        \ $env:RUNNER_TEMP \"compatibility-compiled-scaffold-2.0.1.md\"\n& .\\target\\\
        debug\\g-switcher-compatibility.exe scaffold $compiledScaffold\nif ($LASTEXITCODE\
        \ -ne 0 -or -not (Test-Path -LiteralPath $compiledScaffold -PathType Leaf))\
        \ {\n  throw 'Compiled compatibility recorder failed to create a scaffold.'\n\
        }\n& .\\target\\debug\\g-switcher-compatibility.exe verify $compiledScaffold\n\
        if ($LASTEXITCODE -eq 0) {\n  throw 'Compiled compatibility verifier unexpectedly\
        \ accepted a PENDING scaffold.'\n}\n$global:LASTEXITCODE = 0\n\n$valid = @'\n\
        # G-switcher 2.0.1 - compatibility verifier fixture\n\n## Manual application\
        \ matrix\n\n| Application | Version tested | Windows build | Auto | Manual\
        \ current word | Selected text | Undo | Password/sensitive fields | Result\
        \ / notes |\n|---|---|---|---|---|---|---|---|---|\n| Notepad | 1.0.0 | 26100\
        \ | PASS | PASS | PASS | PASS | N/A | fixture |\n| Microsoft Word | 1.0.0\
        \ | 26100 | PASS | PASS | PASS | PASS | N/A | fixture |\n| Microsoft Edge\
        \ | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS | fixture |\n| Google\
        \ Chrome | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS | fixture |\n\
        | Telegram Desktop | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A | fixture\
        \ |\n| Visual Studio Code | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A\
        \ | fixture |\n| Windows Terminal | 1.0.0 | 26100 | UNSUPPORTED/FAIL-OPEN\
        \ | UNSUPPORTED/FAIL-OPEN | UNSUPPORTED/FAIL-OPEN | N/A | N/A | fixture |\n\
        \n## End fixture\n'@\n$validPath = Join-Path $env:RUNNER_TEMP \"compatibility-valid-2.0.1.md\"\
        \nSet-Content -LiteralPath $validPath -Value $valid -Encoding UTF8\n\n& $windowsPowerShell\
        \ -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\verify-compatibility-v201.ps1\
        \ -Path $validPath\nif ($LASTEXITCODE -ne 0) {\n  throw 'PowerShell compatibility\
        \ verifier rejected a complete non-blocking matrix.'\n}\n& .\\target\\debug\\\
        g-switcher-compatibility.exe verify $validPath\nif ($LASTEXITCODE -ne 0) {\n\
        \  throw 'Compiled compatibility verifier rejected a complete non-blocking\
        \ matrix.'\n}\n\n$invalidBrowser = $valid.Replace(\n  '| Microsoft Edge |\
        \ 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS |',\n  '| Microsoft Edge\
        \ | 1.0.0 | 26100 | UNSUPPORTED/FAIL-OPEN | PASS | PASS | PASS | PASS |'\n\
        )\n$invalidBrowserPath = Join-Path $env:RUNNER_TEMP \"compatibility-invalid-browser-2.0.1.md\"\
        \nSet-Content -LiteralPath $invalidBrowserPath -Value $invalidBrowser -Encoding\
        \ UTF8\n& $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\\\
        scripts\\verify-compatibility-v201.ps1 -Path $invalidBrowserPath\nif ($LASTEXITCODE\
        \ -eq 0) {\n  throw 'PowerShell verifier unexpectedly accepted unsupported\
        \ Edge core behavior.'\n}\n$global:LASTEXITCODE = 0\n& .\\target\\debug\\\
        g-switcher-compatibility.exe verify $invalidBrowserPath\nif ($LASTEXITCODE\
        \ -eq 0) {\n  throw 'Compiled verifier unexpectedly accepted unsupported Edge\
        \ core behavior.'\n}\n$global:LASTEXITCODE = 0\n\n$invalidCore = $valid.Replace(\n\
        \  '| Notepad | 1.0.0 | 26100 | PASS |',\n  '| Notepad | 1.0.0 | 26100 | N/A\
        \ |'\n)\n$invalidCorePath = Join-Path $env:RUNNER_TEMP \"compatibility-invalid-core-2.0.1.md\"\
        \nSet-Content -LiteralPath $invalidCorePath -Value $invalidCore -Encoding\
        \ UTF8\n& .\\target\\debug\\g-switcher-compatibility.exe verify $invalidCorePath\n\
        if ($LASTEXITCODE -eq 0) {\n  throw 'Compiled verifier unexpectedly accepted\
        \ N/A for a core text-operation column.'\n}\n$global:LASTEXITCODE = 0\n\n\
        $invalidMetadata = $valid.Replace(\n  '| Microsoft Word | 1.0.0 | 26100 |',\n\
        \  '| Microsoft Word | UNKNOWN | 26100 |'\n)\n$invalidMetadataPath = Join-Path\
        \ $env:RUNNER_TEMP \"compatibility-invalid-metadata-2.0.1.md\"\nSet-Content\
        \ -LiteralPath $invalidMetadataPath -Value $invalidMetadata -Encoding UTF8\n\
        & .\\target\\debug\\g-switcher-compatibility.exe verify $invalidMetadataPath\n\
        if ($LASTEXITCODE -eq 0) {\n  throw 'Compiled verifier unexpectedly accepted\
        \ UNKNOWN application metadata.'\n}\n$global:LASTEXITCODE = 0\n"
    - name: Build cross-process E2E helper
      shell: pwsh
      run: cargo build --locked --bin g-switcher-e2e-helper
    - name: Windows same-process E2E
      shell: pwsh
      run: cargo test --locked --lib real_windows_hook_to_edit_e2e -- --ignored --test-threads=1
        --nocapture
    - name: Windows cross-process E2E
      shell: pwsh
      run: '$env:G_SWITCHER_E2E_HELPER = (Resolve-Path "target/debug/g-switcher-e2e-helper.exe").Path

        cargo test --locked --lib real_cross_process_edit_e2e_release_gate -- --ignored
        --test-threads=1 --nocapture

        '
    - name: Real Edge and Chrome UIA adapter E2E
      shell: pwsh
      run: "$arguments = @(\n  'test', '--locked', '--test', 'browser_uia_adapter',\
        \ '--',\n  '--ignored', '--test-threads=1', '--nocapture'\n)\n$process = Start-Process\
        \ -FilePath 'cargo.exe' -ArgumentList $arguments -PassThru -NoNewWindow\n\
        if (-not $process.WaitForExit(240000)) {\n  Write-Host 'Browser UIA E2E exceeded\
        \ 240 seconds; terminating cargo and descendants.'\n  & taskkill.exe /PID\
        \ $process.Id /T /F | Out-Host\n  throw 'Real Edge/Chrome UIA adapter E2E\
        \ timed out.'\n}\n$process.WaitForExit()\nif ($process.ExitCode -ne 0) {\n\
        \  throw \"Real Edge/Chrome UIA adapter E2E failed with exit code $($process.ExitCode).\"\
        \n}\n"
    - name: Windows hung and closing target E2E
      shell: pwsh
      run: '$env:G_SWITCHER_E2E_HELPER = (Resolve-Path "target/debug/g-switcher-e2e-helper.exe").Path

        cargo run --locked --bin g-switcher-failure-e2e

        '
    - name: Release build
      shell: pwsh
      run: cargo build --locked --release --bin g-switcher --bin g-switcher-compatibility
    - name: First-run actual font and clipping QA
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\nif ($env:GITHUB_ACTIONS -ne 'true') {\
        \ throw 'Ephemeral CI host only' }\nRemove-Item -LiteralPath 'HKCU:\\Software\\\
        GSwitcher' -Recurse -Force -ErrorAction SilentlyContinue\nAdd-Type -AssemblyName\
        \ System.Drawing\nAdd-Type @'\nusing System;\nusing System.Text;\nusing System.Collections.Generic;\n\
        using System.Runtime.InteropServices;\npublic class LayoutQA {\n [StructLayout(LayoutKind.Sequential)]\
        \ public struct R { public int left,top,right,bottom; }\n public delegate\
        \ bool Callback(IntPtr h,IntPtr p);\n [DllImport(\"user32.dll\")] public static\
        \ extern bool EnumChildWindows(IntPtr h,Callback cb,IntPtr p);\n [DllImport(\"\
        user32.dll\")] public static extern bool GetClientRect(IntPtr h,out R r);\n\
        \ [DllImport(\"user32.dll\")] public static extern bool GetWindowRect(IntPtr\
        \ h,out R r);\n [DllImport(\"user32.dll\")] public static extern int MapWindowPoints(IntPtr\
        \ a,IntPtr b,ref R r,uint n);\n [DllImport(\"user32.dll\",CharSet=CharSet.Unicode)]\
        \ public static extern int GetWindowText(IntPtr h,StringBuilder s,int n);\n\
        \ [DllImport(\"user32.dll\",CharSet=CharSet.Unicode)] public static extern\
        \ int GetClassName(IntPtr h,StringBuilder s,int n);\n [DllImport(\"user32.dll\"\
        )] public static extern IntPtr GetDC(IntPtr h);\n [DllImport(\"user32.dll\"\
        )] public static extern int ReleaseDC(IntPtr h,IntPtr dc);\n [DllImport(\"\
        user32.dll\")] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr\
        \ w,IntPtr l);\n [DllImport(\"gdi32.dll\")] public static extern IntPtr SelectObject(IntPtr\
        \ dc,IntPtr o);\n [DllImport(\"user32.dll\",CharSet=CharSet.Unicode)] public\
        \ static extern int DrawText(IntPtr dc,string s,int n,ref R r,uint f);\n [DllImport(\"\
        user32.dll\")] public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint\
        \ f);\n [DllImport(\"user32.dll\")] public static extern bool PostMessage(IntPtr\
        \ h,uint m,IntPtr w,IntPtr l);\n public class Row { public string text; public\
        \ string cls; public int x,y,width,height,needed; }\n public static List<Row>\
        \ Inspect(IntPtr parent) {\n  R client; GetClientRect(parent,out client);\
        \ var rows=new List<Row>();\n  EnumChildWindows(parent,(h,p)=> {\n   var text=new\
        \ StringBuilder(4096); var cls=new StringBuilder(128); GetWindowText(h,text,text.Capacity);\
        \ GetClassName(h,cls,cls.Capacity);\n   R rect; GetWindowRect(h,out rect);\
        \ MapWindowPoints(IntPtr.Zero,parent,ref rect,2);\n   var row=new Row {text=text.ToString(),cls=cls.ToString(),x=rect.left,y=rect.top,width=rect.right-rect.left,height=rect.bottom-rect.top};\n\
        \   if (row.cls==\"Static\" && row.text.Length>0) {\n    var dc=GetDC(h);\
        \ var font=SendMessage(h,0x31,IntPtr.Zero,IntPtr.Zero); var old=SelectObject(dc,font);\n\
        \    var measured=new R {right=row.width}; DrawText(dc,row.text,row.text.Length,ref\
        \ measured,0x400|0x10|0x800);\n    SelectObject(dc,old); ReleaseDC(h,dc);\
        \ row.needed=measured.bottom-measured.top;\n    if(row.needed>row.height ||\
        \ row.y+row.height>client.bottom) throw new Exception(\"Clipped static: \"\
        +row.text);\n   }\n   rows.Add(row); return true;\n  },IntPtr.Zero); return\
        \ rows;\n }\n}\n'@\n$exe = (Resolve-Path 'target/release/g-switcher.exe').Path\n\
        $p = Start-Process -FilePath $exe -PassThru\ntry {\n  $deadline = [DateTime]::UtcNow.AddSeconds(30)\n\
        \  do { Start-Sleep -Milliseconds 200; $p.Refresh(); $hwnd = $p.MainWindowHandle\
        \ } while ($hwnd -eq 0 -and -not $p.HasExited -and [DateTime]::UtcNow -lt\
        \ $deadline)\n  if ($hwnd -eq 0) { throw 'First-run window missing' }\n  Start-Sleep\
        \ -Milliseconds 400\n  $rows = [LayoutQA]::Inspect($hwnd)\n  if (@($rows |\
        \ Where-Object { $_.text -like '*\u0423\u043F\u0440\u0430\u0432\u043B\u0435\
        \u043D\u0438\u0435*' }).Count -eq 0) { throw 'Unexpected window' }\n  $out\
        \ = Join-Path $env:RUNNER_TEMP 'first-run-layout-qa'\n  New-Item -ItemType\
        \ Directory -Force -Path $out | Out-Null\n  $rows | ConvertTo-Json -Depth\
        \ 5 | Set-Content -LiteralPath (Join-Path $out 'layout.json') -Encoding utf8\n\
        \  $r = New-Object LayoutQA+R\n  [LayoutQA]::GetWindowRect($hwnd,[ref]$r)\
        \ | Out-Null\n  $bmp = [System.Drawing.Bitmap]::new(($r.right-$r.left),($r.bottom-$r.top))\n\
        \  $g = [System.Drawing.Graphics]::FromImage($bmp)\n  $dc = $g.GetHdc()\n\
        \  try { if (-not [LayoutQA]::PrintWindow($hwnd,$dc,0)) { throw 'PrintWindow\
        \ failed' } } finally { $g.ReleaseHdc($dc) }\n  $bmp.Save((Join-Path $out\
        \ 'first-run.png'),[System.Drawing.Imaging.ImageFormat]::Png)\n  $g.Dispose();\
        \ $bmp.Dispose()\n  Write-Host \"FIRST_RUN_LAYOUT_PASS controls=$($rows.Count)\"\
        \n} finally {\n  if (-not $p.HasExited) { [LayoutQA]::PostMessage($p.MainWindowHandle,0x10,[IntPtr]::Zero,[IntPtr]::Zero)\
        \ | Out-Null; if (-not $p.WaitForExit(5000)) { $p.Kill(); $p.WaitForExit()\
        \ } }\n}\n"
    - name: Upload first-run layout evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: first-run-layout-qa
        path: ${{ runner.temp }}/first-run-layout-qa
        if-no-files-found: error
    - name: Release and branding checks
      shell: pwsh
      run: "./scripts/release-check.ps1\n$compat = \"target/release/g-switcher-compatibility.exe\"\
        \nif (-not (Test-Path -LiteralPath $compat -PathType Leaf)) {\n  throw 'Compiled\
        \ compatibility executable is missing from the release build.'\n}\n$compatHash\
        \ = (Get-FileHash -LiteralPath $compat -Algorithm SHA256).Hash.ToLowerInvariant()\n\
        Set-Content -LiteralPath \"$compat.sha256\" -Value \"$compatHash  g-switcher-compatibility.exe\"\
        \ -Encoding ascii -NoNewline\nWrite-Host \"Compatibility tool SHA256: $compatHash\"\
        \n"
    - name: Microsoft Defender scan
      shell: pwsh
      run: "$mpCmd = @(\n  \"$env:ProgramFiles\\Windows Defender\\MpCmdRun.exe\",\n\
        \  \"$env:ProgramData\\Microsoft\\Windows Defender\\Platform\\*\\MpCmdRun.exe\"\
        \n) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } | Sort-Object\
        \ FullName -Descending | Select-Object -First 1\nif ($null -eq $mpCmd) {\n\
        \  Write-Warning 'Microsoft Defender command-line scanner is unavailable on\
        \ this runner; other release gates continue.'\n  exit 0\n}\nforeach ($path\
        \ in @('target/release/g-switcher.exe', 'target/release/g-switcher-compatibility.exe'))\
        \ {\n  & $mpCmd.FullName -Scan -ScanType 3 -File (Resolve-Path $path).Path\
        \ -DisableRemediation\n  if ($LASTEXITCODE -ne 0) {\n    throw \"Microsoft\
        \ Defender scan failed or detected a threat for $path (exit $LASTEXITCODE).\"\
        \n  }\n}\n"
    - name: Verify exact clean source revision before packaging
      env:
        EXPECTED_SOURCE_SHA: ${{ needs.managed.outputs.candidate_sha }}
      run: python scripts/verify_build_revision.py --require-clean
    - name: Prepare public release package
      shell: pwsh
      run: "$packageRoot = \"target/release/g-switcher-2.0.1\"\nNew-Item -ItemType\
        \ Directory -Path $packageRoot -Force | Out-Null\nCopy-Item -LiteralPath target/release/g-switcher.exe\
        \ -Destination $packageRoot\nCopy-Item -LiteralPath target/release/g-switcher.exe.sha256\
        \ -Destination $packageRoot\nCopy-Item -LiteralPath README.md -Destination\
        \ $packageRoot\nCopy-Item -LiteralPath CHANGELOG.md -Destination $packageRoot\n\
        Copy-Item -LiteralPath RELEASE_NOTES_2.0.1.md -Destination $packageRoot\n\
        Copy-Item -LiteralPath THIRD_PARTY_DATA.md -Destination $packageRoot\nCopy-Item\
        \ -LiteralPath COMPATIBILITY_2.0.1.md -Destination $packageRoot\n\n$head =\
        \ (git rev-parse HEAD).Trim()\n$rustVersion = (rustc --version).Trim()\n$cargoVersion\
        \ = (cargo --version).Trim()\n$lockHash = (Get-FileHash -LiteralPath Cargo.lock\
        \ -Algorithm SHA256).Hash.ToLowerInvariant()\n$exeHash = (Get-FileHash -LiteralPath\
        \ target/release/g-switcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()\n\
        $provenance = @(\n  'G-switcher 2.0.1 build provenance',\n  \"commit=$head\"\
        ,\n  \"workflow_run_id=$env:GITHUB_RUN_ID\",\n  \"workflow_run_number=$env:GITHUB_RUN_NUMBER\"\
        ,\n  \"rust=$rustVersion\",\n  \"cargo=$cargoVersion\",\n  \"cargo_lock_sha256=$lockHash\"\
        ,\n  \"g-switcher.exe_sha256=$exeHash\"\n)\nSet-Content -LiteralPath (Join-Path\
        \ $packageRoot 'BUILD_PROVENANCE.txt') -Value $provenance -Encoding ascii\n\
        \n$zip = \"target/release/g-switcher-2.0.1-windows-x64.zip\"\nCompress-Archive\
        \ -Path \"$packageRoot/*\" -DestinationPath $zip -CompressionLevel Optimal\n\
        $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()\n\
        Set-Content -LiteralPath \"$zip.sha256\" -Value \"$hash  g-switcher-2.0.1-windows-x64.zip\"\
        \ -Encoding ascii -NoNewline\n"
    - name: Prepare manual compatibility kit
      shell: pwsh
      run: "$kitRoot = \"target/manual-compatibility/g-switcher-2.0.1\"\nNew-Item\
        \ -ItemType Directory -Path $kitRoot -Force | Out-Null\nCopy-Item -LiteralPath\
        \ target/release/g-switcher.exe -Destination $kitRoot\nCopy-Item -LiteralPath\
        \ target/release/g-switcher.exe.sha256 -Destination $kitRoot\nCopy-Item -LiteralPath\
        \ target/release/g-switcher-compatibility.exe -Destination $kitRoot\nCopy-Item\
        \ -LiteralPath target/release/g-switcher-compatibility.exe.sha256 -Destination\
        \ $kitRoot\nCopy-Item -LiteralPath manual-browser-test-2.0.1.html -Destination\
        \ $kitRoot\nCopy-Item -LiteralPath scripts/manual-compatibility-v201.ps1 -Destination\
        \ $kitRoot\nCopy-Item -LiteralPath scripts/verify-compatibility-v201.ps1 -Destination\
        \ $kitRoot\nCopy-Item -LiteralPath COMPATIBILITY_2.0.1.md -Destination $kitRoot\n\
        Copy-Item -LiteralPath MANUAL_TESTING_2.0.1.md -Destination $kitRoot\nCopy-Item\
        \ -LiteralPath BROWSER_QUICK_TEST_2.0.1_RU.md -Destination $kitRoot\n\n$head\
        \ = (git rev-parse HEAD).Trim()\n$rustVersion = (rustc --version).Trim()\n\
