name: Apply corpus harness optimization

on:
  push:
    branches: ["feature/1.0.4-wikipedia-corpus"]
    paths:
      - "scripts/optimize-corpus-harness.py"
      - ".github/workflows/apply-corpus-harness-optimization.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/1.0.4-wikipedia-corpus
          fetch-depth: 1
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
      - name: Apply optimization
        shell: pwsh
        run: |
          python ./scripts/optimize-corpus-harness.py
          cargo fmt --all
      - name: Commit optimization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_runtime/corpus_e2e.rs
          git commit -m "Optimize Wikipedia corpus E2E layout reuse"
          git push origin HEAD:feature/1.0.4-wikipedia-corpus
