name: Patch 1.0 Clippy constants

on:
  push:
    branches:
      - feature/1.0.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/1.0.0

      - name: Patch constant assertions
        shell: pwsh
        run: |
          $path = 'src/detector.rs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $old = @'
              fn sensitivity_thresholds_are_strictly_ordered() {
                  assert!(CONSERVATIVE_CONFIDENCE_THRESHOLD > NORMAL_CONFIDENCE_THRESHOLD);
                  assert!(NORMAL_CONFIDENCE_THRESHOLD > AGGRESSIVE_CONFIDENCE_THRESHOLD);
              }
          '@
          $new = @'
              fn sensitivity_thresholds_are_strictly_ordered() {
                  const {
                      assert!(CONSERVATIVE_CONFIDENCE_THRESHOLD > NORMAL_CONFIDENCE_THRESHOLD);
                      assert!(NORMAL_CONFIDENCE_THRESHOLD > AGGRESSIVE_CONFIDENCE_THRESHOLD);
                  }
              }
          '@
          if ($text.Contains('fn sensitivity_thresholds_are_strictly_ordered()') -and -not $text.Contains('const {')) {
            if (-not $text.Contains($old)) { throw 'Expected sensitivity test block not found.' }
            $text = $text.Replace($old, $new)
            Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
          }

      - name: Format
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          cargo fmt --all

      - name: Commit patch
        shell: pwsh
        run: |
          git add src/detector.rs
          if (git diff --cached --quiet) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Clippy constant assertions'
          git push origin HEAD:feature/1.0.0
