name: War and Peace boundary patch

on:
  push:
    branches:
      - audit/war-and-peace-full-1.0.7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply boundary refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detector = Path('src/detector.rs')
          s = detector.read_text(encoding='utf-8')
          if 'detect_at_boundary_with_context' not in s:
              start = s.index('pub fn detect_with_context(')
              body = s.index('    if is_code_safe_token', start)
              replacement = '''pub fn detect_with_context(
              token: &str,
              user_words: &[String],
              previous_tokens: &[String],
          ) -> Option<Detection> {
              detect_with_context_policy(token, user_words, previous_tokens, true)
          }

          pub fn detect_at_boundary_with_context(
              token: &str,
              user_words: &[String],
              previous_tokens: &[String],
          ) -> Option<Detection> {
              detect_with_context_policy(token, user_words, previous_tokens, false)
          }

          fn detect_with_context_policy(
              token: &str,
              user_words: &[String],
              previous_tokens: &[String],
              hold_target_prefix: bool,
          ) -> Option<Detection> {
          '''
              s = s[:start] + replacement + s[body:]
              old = '    if is_target_word_prefix(&mapped_normalized, target, user_words) {'
              if old not in s:
                  raise SystemExit('prefix guard marker missing')
              s = s.replace(old, '    if hold_target_prefix && is_target_word_prefix(&mapped_normalized, target, user_words) {', 1)

              insert_at = s.index('\n\npub fn opposite_candidate_is_prefix')
              helper = '''

          pub fn correction_at_boundary_with_context(
              token: &str,
              user_words: &[String],
              confidence_threshold: u8,
              previous_tokens: &[String],
          ) -> Option<Detection> {
              let detection = detect_at_boundary_with_context(token, user_words, previous_tokens)?;
              (detection.confidence >= confidence_threshold).then_some(detection)
          }'''
              s = s[:insert_at] + helper + s[insert_at:]

              anchor = '    #[test]\n    fn exact_dictionary_match_has_maximum_confidence()'
              pos = s.index(anchor)
              test = '''    #[test]
          fn boundary_detection_does_not_hold_complete_target_prefix() {
              let context = vec!["князь".to_owned(), "сказал".to_owned()];
              assert!(opposite_candidate_is_prefix("gmth"));
              let detection = correction_at_boundary_with_context(
                  "gmth",
                  &[],
                  DEFAULT_CONFIDENCE_THRESHOLD,
                  &context,
              )
              .expect("пьер at a true word boundary should correct");
              assert_eq!(detection.corrected, "пьер");
              assert_eq!(detection.target, Language::Russian);
          }

          '''
              s = s[:pos] + test + s[pos:]
              detector.write_text(s, encoding='utf-8')

              runtime = Path('src/windows_runtime/mod.rs')
              r = runtime.read_text(encoding='utf-8')
              old_import = '    correction_with_context, infer_language, opposite_candidate_is_prefix_for_language,\n    MAX_CONTEXT_WORDS,'
              new_import = '    correction_at_boundary_with_context, correction_with_context, infer_language,\n    opposite_candidate_is_prefix_for_language, MAX_CONTEXT_WORDS,'
              if old_import not in r:
                  raise SystemExit('runtime import marker missing')
              r = r.replace(old_import, new_import, 1)
              r = r.replace('if allow_auto && self.try_correct(target, delimiter) {', 'if allow_auto && self.try_correct(target, delimiter, true) {', 1)
              r = r.replace('if allow_auto && self.try_correct(target, delimiter) {', 'if allow_auto && self.try_correct(target, delimiter, false) {', 1)
              old_sig = '    fn try_correct(&mut self, source: FocusTarget, delimiter: Delimiter) -> bool {'
              if old_sig not in r:
                  raise SystemExit('try_correct signature marker missing')
              r = r.replace(old_sig, '    fn try_correct(&mut self, source: FocusTarget, delimiter: Delimiter, at_boundary: bool) -> bool {', 1)
              call_start = r.index('        let Some(detection) = correction_with_context(', r.index('    fn try_correct('))
              call_end = r.index('        if detection.source != source.language {', call_start)
              call = '''        let detection = if at_boundary {
              correction_at_boundary_with_context(
                  &self.candidate,
                  &runtime_settings.user_words,
                  runtime_settings.sensitivity.confidence_threshold(),
                  &self.context_tokens,
              )
          } else {
              correction_with_context(
                  &self.candidate,
                  &runtime_settings.user_words,
                  runtime_settings.sensitivity.confidence_threshold(),
                  &self.context_tokens,
              )
          };
          let Some(detection) = detection else {
              return false;
          };
          '''
              r = r[:call_start] + call + r[call_end:]
              runtime.write_text(r, encoding='utf-8')

              audit = Path('examples/war_and_peace_audit.rs')
              a = audit.read_text(encoding='utf-8')
              old_a = '        correction_with_context, detect_with_context, opposite_candidate_is_prefix,'
              new_a = '        correction_at_boundary_with_context, detect_at_boundary_with_context,\n        opposite_candidate_is_prefix,'
              if old_a not in a:
                  raise SystemExit('audit import marker missing')
              a = a.replace(old_a, new_a, 1)
              a = a.replace('correction_with_context(', 'correction_at_boundary_with_context(')
              a = a.replace('detect_with_context(', 'detect_at_boundary_with_context(')
              audit.write_text(a, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          if git diff --quiet -- src/detector.rs src/windows_runtime/mod.rs examples/war_and_peace_audit.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/detector.rs src/windows_runtime/mod.rs examples/war_and_peace_audit.rs
          git commit -m 'Scope target-prefix hold to punctuation input'
          git push origin HEAD:audit/war-and-peace-full-1.0.7
