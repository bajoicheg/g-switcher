name: War and Peace clean full-text audit

on:
  push:
    branches: [audit/war-and-peace-full-1.0.7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: war-and-peace-clean-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Refine mixed-language protection once
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detector = Path('src/detector.rs')
          s = detector.read_text(encoding='utf-8')
          if 'common_foreign_latin_source_words_are_protected' in s:
              Path('/tmp/changed').write_text('0')
              raise SystemExit(0)

          start = s.index('    let source_score =')
          end = s.index('\n\n    // Unknown short words', start)
          scoring = '''    let source_score =
              language_score(&normalized, source) + frequency_model::lexical_score(source, &normalized);
          let target_score = language_score(&mapped_normalized, target)
              + frequency_model::lexical_score(target, &mapped_normalized);
          let context_bonus = context_bonus(target, &mapped_normalized, previous_tokens, user_words);
          let effective_target = target_score + context_bonus;
          let effective_margin = target_score - source_score + context_bonus;

          if effective_target < 10 || effective_margin < 5 {
              return None;
          }'''
          s = s[:start] + scoring + s[end:]

          marker = '    #[test]\n    fn exact_dictionary_match_has_maximum_confidence()'
          pos = s.index(marker)
          test = '''    #[test]
          fn common_foreign_latin_source_words_are_protected() {
              for token in [
                  "que", "sire", "une", "des", "monsieur", "comme", "ils", "mot", "quelle",
                  "votre", "adieu", "dans", "die", "merci", "pas", "sans", "sur",
              ] {
                  assert!(correction(token).is_none(), "Latin-layout source must stay source: {token}");
              }
          }

          '''
          s = s[:pos] + test + s[pos:]
          detector.write_text(s, encoding='utf-8')

          foreign = '''abc adieu avec ayez bah bas bien bon bonsoir causons cela celui ces chef comme contez contrat croyez dans das des devriez die dieu dont ein elle enfant enfin epe euer faire fait fameuse faut feu fil filez gobelins gott homme ils jeu jeune joseph julie lanfrey lle macht merci mes monsieur mot mots nichts nocturne omme ont pas peut pitt poltawa prime que quel quelle quelques quos sans sic sire sobriquet son sophie soyez sublime sur tant tutti une urienne vaut venez vienne vos votre voyez zum'''
          freq = Path('src/frequency_model.rs')
          fs = freq.read_text(encoding='utf-8')
          anchor = fs.index('static EN_COMMON')
          let_words = fs.index('let words =', anchor)
          quote = fs.index('"', let_words) + 1
          fs = fs[:quote] + foreign + ' ' + fs[quote:]
          freq.write_text(fs, encoding='utf-8')
          Path('/tmp/changed').write_text('1')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"
      - name: Validate refined source change
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Commit validated source change
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/detector.rs src/frequency_model.rs
          git commit -m 'Refine Latin-layout protection from full-novel audit'
          git push origin HEAD:audit/war-and-peace-full-1.0.7

  audit:
    needs: patch
    if: needs.patch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Extract exact novel range from official Tolstoy.ru DOCX
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          url='https://tolstoy.ru/upload/wap/War_and_Peace.docx'
          req=urllib.request.Request(url,headers={'User-Agent':'G-switcher-clean-novel-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(io.BytesIO(data)) as zf: root=ET.fromstring(zf.read('word/document.xml'))
          paras=[]
          for idx,p in enumerate(root.findall('.//w:body/w:p',ns)):
              text=''.join((n.text or '') for n in p.findall('.//w:t',ns))
              style=None
              ppr=p.find('w:pPr',ns)
              if ppr is not None:
                  ps=ppr.find('w:pStyle',ns)
                  if ps is not None: style=ps.attrib.get('{%s}val'%ns['w'])
              paras.append((idx,style,text))
          heading=start=end=None
          for idx,style,text in paras:
              if heading is None and style=='Heading1' and text.startswith('ВОЙНА И МИР'): heading=idx
              elif heading is not None and start is None and style=='Heading2' and text.strip()=='ТОМ ПЕРВЫЙ': start=idx
              elif start is not None and style=='Heading1' and text.startswith('ПЕЧАТНЫЕ ВАРИАНТЫ'):
                  end=idx; break
          if (heading,start,end)!=(443,452,14260): raise RuntimeError((heading,start,end))
          selected=[text for idx,style,text in paras if start<=idx<end]
          nonempty=[x for x in selected if x]
          if nonempty[0]!='ТОМ ПЕРВЫЙ' or nonempty[-1]!='Конец.': raise RuntimeError('boundary mismatch')
          text='\n'.join(selected)
          pathlib.Path('audit-corpus').mkdir(exist_ok=True)
          pathlib.Path('audit-corpus/war_and_peace_novel.txt').write_text(text,encoding='utf-8')
          pathlib.Path('audit-corpus/provenance.txt').write_text(
              f'source_url={url}\ndocx_sha256={hashlib.sha256(data).hexdigest()}\nnovel_chars={len(text)}\n',encoding='utf-8')
          PY
      - name: Run actual Detector v3 on every eligible occurrence
        shell: bash
        run: |
          cargo run --release --quiet --example war_and_peace_audit -- audit-corpus/war_and_peace_novel.txt
          cat audit-output/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: war-and-peace-clean-full-text-audit
          path: |
            audit-output/
            audit-corpus/provenance.txt
          retention-days: 30
          if-no-files-found: error
