name: War and Peace clean full-text audit

on:
  push:
    branches: [audit/war-and-peace-full-1.0.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: war-and-peace-clean-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add clean four-volume War and Peace audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Extract only the four-volume novel plus epilogue
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import io
          import pathlib
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET

          url = 'https://tolstoy.ru/upload/wap/War_and_Peace.docx'
          req = urllib.request.Request(url, headers={'User-Agent':'G-switcher-clean-novel-audit/1.0'})
          with urllib.request.urlopen(req, timeout=90) as r:
              data = r.read()
          if not data.startswith(b'PK'):
              raise RuntimeError('expected DOCX')

          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              root = ET.fromstring(zf.read('word/document.xml'))

          paragraphs = []
          for idx, p in enumerate(root.findall('.//w:body/w:p', ns)):
              text = ''.join((n.text or '') for n in p.findall('.//w:t', ns))
              style = None
              ppr = p.find('w:pPr', ns)
              if ppr is not None:
                  pstyle = ppr.find('w:pStyle', ns)
                  if pstyle is not None:
                      style = pstyle.attrib.get('{%s}val' % ns['w'])
              paragraphs.append((idx, style, text))

          main_heading = None
          start = None
          end = None
          for idx, style, text in paragraphs:
              if main_heading is None and style == 'Heading1' and text.startswith('ВОЙНА И МИР'):
                  main_heading = idx
                  continue
              if main_heading is not None and start is None and style == 'Heading2' and text.strip() == 'ТОМ ПЕРВЫЙ':
                  start = idx
                  continue
              if start is not None and style == 'Heading1' and text.startswith('ПЕЧАТНЫЕ ВАРИАНТЫ'):
                  end = idx
                  break

          if (main_heading, start, end) != (443, 452, 14260):
              raise RuntimeError(f'unexpected structural boundaries: {(main_heading, start, end)}')
          selected = [text for idx, style, text in paragraphs if start <= idx < end]
          if not selected or selected[0] != 'ТОМ ПЕРВЫЙ' or selected[-2:] != ['', 'Конец.']:
              # Empty paragraphs can vary in joins; verify explicit terminator independently below.
              pass
          nonempty = [p for p in selected if p]
          if nonempty[0] != 'ТОМ ПЕРВЫЙ' or nonempty[-1] != 'Конец.':
              raise RuntimeError(f'bad novel boundaries: {nonempty[:1]} ... {nonempty[-1:]}')

          text = '\n'.join(selected)
          pathlib.Path('audit-corpus').mkdir(exist_ok=True)
          pathlib.Path('audit-corpus/war_and_peace_novel.txt').write_text(text, encoding='utf-8')
          provenance = (
              f'source_url={url}\n'
              f'docx_bytes={len(data)}\n'
              f'docx_sha256={hashlib.sha256(data).hexdigest()}\n'
              f'document_paragraphs={len(paragraphs)}\n'
              f'main_heading_paragraph={main_heading}\n'
              f'novel_start_paragraph={start}\n'
              f'novel_end_exclusive_paragraph={end}\n'
              f'novel_paragraphs={len(selected)}\n'
              f'novel_chars={len(text)}\n'
              f'first_nonempty={nonempty[0]}\n'
              f'last_nonempty={nonempty[-1]}\n'
          )
          pathlib.Path('audit-corpus/provenance.txt').write_text(provenance, encoding='utf-8')
          print(provenance)
          PY

      - name: Run actual Detector v3 over every eligible occurrence
        shell: bash
        run: |
          cargo run --release --quiet --example war_and_peace_audit -- audit-corpus/war_and_peace_novel.txt
          echo '--- summary ---'
          cat audit-output/summary.txt
          echo '--- top RU misses by source order sample ---'
          head -n 60 audit-output/failures.csv
          echo '--- RU source false positives ---'
          cat audit-output/russian_source_false_positives.csv
          echo '--- Latin/French source false positives ---'
          cat audit-output/latin_source_false_positives.csv

      - name: Upload clean audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: war-and-peace-clean-full-text-audit
          path: |
            audit-output/
            audit-corpus/provenance.txt
          retention-days: 30
          if-no-files-found: error
