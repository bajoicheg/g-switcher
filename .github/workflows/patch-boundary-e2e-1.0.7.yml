name: Patch G-switcher 1.0.7 boundary E2E

on:
  push:
    branches: [audit/war-and-peace-full-1.0.7]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Patch boundary E2E to build context through real input
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/windows_runtime/e2e_tests.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    eprintln!("G-switcher E2E checkpoint: boundary prefix completion");
    prepare_case(window, edit, ui_thread_id, Language::English);
    {
        let mut engine = ENGINE.get_or_init(|| Mutex::new(Engine::default())).lock();
        engine.context_tokens = vec!["князь".to_owned(), "сказал".to_owned()];
    }
    inject_strokes(&keys(b"GMTH "));
    await_text(edit, "пьер ");
'''
          new = '''    eprintln!("G-switcher E2E checkpoint: boundary prefix completion");
    prepare_case(window, edit, ui_thread_id, Language::Russian);
    inject_strokes(&keys(b"RYZPM CRFPFK "));
    await_text(edit, "князь сказал ");
    let english_hkl = select_layout(Language::English).expect("English HKL is unavailable");
    assert!(
        switch_layout(edit, ui_thread_id, english_hkl),
        "test context layout switch RU -> EN failed"
    );
    inject_strokes(&keys(b"GMTH "));
    await_text(edit, "князь сказал пьер ");
'''
          if new in s:
              Path('/tmp/changed').write_text('0')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              Path('/tmp/changed').write_text('1')
          else:
              raise SystemExit('boundary E2E block not found')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"
      - name: Validate patch
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all -- --check
          cargo test --all-targets
      - name: Commit patch
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/windows_runtime/e2e_tests.rs
          git commit -m 'Fix boundary E2E context setup'
          git push origin HEAD:audit/war-and-peace-full-1.0.7
