name: Wikipedia five-corpus detector audit

on:
  push:
    branches: [audit/wikipedia-five-1.0.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikipedia-five-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Fetch Wikipedia plaintext corpus
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          articles = {
              'russia.txt': 'Россия',
              'moscow.txt': 'Москва',
              'wwii.txt': 'Вторая мировая война',
              'internet.txt': 'Интернет',
              'universe.txt': 'Вселенная',
          }
          out = pathlib.Path('audit-corpus')
          out.mkdir(exist_ok=True)
          for filename, title in articles.items():
              params = urllib.parse.urlencode({
                  'action': 'query',
                  'prop': 'extracts',
                  'explaintext': '1',
                  'redirects': '1',
                  'titles': title,
                  'format': 'json',
                  'formatversion': '2',
              })
              url = 'https://ru.wikipedia.org/w/api.php?' + params
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'G-switcher-corpus-audit/1.0 (GitHub Actions)'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              page = payload['query']['pages'][0]
              extract = page.get('extract', '')
              if not extract:
                  raise RuntimeError(f'empty extract for {title}')
              (out / filename).write_text(extract, encoding='utf-8')
              print(f'{title}: {len(extract)} chars')
          PY

      - name: Run Detector v3 five-corpus audit
        shell: bash
        run: |
          cargo run --quiet --example wikipedia_corpus_audit -- \
            'Россия=audit-corpus/russia.txt' \
            'Москва=audit-corpus/moscow.txt' \
            'Вторая мировая война=audit-corpus/wwii.txt' \
            'Интернет=audit-corpus/internet.txt' \
            'Вселенная=audit-corpus/universe.txt'
          echo '--- failures ---'
          cat audit-output/failures.csv

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wikipedia-five-detector-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
