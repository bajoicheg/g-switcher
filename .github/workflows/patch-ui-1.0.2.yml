name: Patch G-switcher 1.0.2 UI

on:
  push:
    branches: ["fix/1.0.2-ui-layout"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/1.0.2-ui-layout
          fetch-depth: 1
      - name: Apply UI patch
        shell: pwsh
        run: ./scripts/patch-ui-1.0.2.ps1
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml build.rs README.md docs/FUNCTIONAL_SPEC.md scripts/release-check.ps1 src/lib.rs src/windows_runtime/ui.rs src/windows_runtime/ui/settings_dialog.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Apply 1.0.2 UI layout fixes"
          git push origin HEAD:fix/1.0.2-ui-layout
