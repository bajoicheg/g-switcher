name: Final Wikipedia corpus verification

on:
  push:
    branches: [audit/wikipedia-five-1.0.5]
    paths: [.github/workflows/final-wikipedia-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Fetch Wikipedia plaintext corpus
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          articles = {
              'russia.txt': 'Россия',
              'moscow.txt': 'Москва',
              'wwii.txt': 'Вторая мировая война',
              'internet.txt': 'Интернет',
              'universe.txt': 'Вселенная',
          }
          out = pathlib.Path('audit-corpus'); out.mkdir(exist_ok=True)
          for filename, title in articles.items():
              params = urllib.parse.urlencode({'action':'query','prop':'extracts','explaintext':'1','redirects':'1','titles':title,'format':'json','formatversion':'2'})
              req = urllib.request.Request('https://ru.wikipedia.org/w/api.php?' + params, headers={'User-Agent':'G-switcher-corpus-audit/1.0 (GitHub Actions)'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              extract = payload['query']['pages'][0].get('extract','')
              if not extract: raise RuntimeError(f'empty extract for {title}')
              (out / filename).write_text(extract, encoding='utf-8')
          PY

      - name: Run final Detector v3 corpus audit
        shell: bash
        run: |
          cargo run --quiet --example wikipedia_corpus_audit -- \
            'Россия=audit-corpus/russia.txt' \
            'Москва=audit-corpus/moscow.txt' \
            'Вторая мировая война=audit-corpus/wwii.txt' \
            'Интернет=audit-corpus/internet.txt' \
            'Вселенная=audit-corpus/universe.txt'
          cat audit-output/failures.csv

      - name: Upload final audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wikipedia-five-detector-audit-final
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
