          $text = $text.Replace('"Pause временный. Secure-поля блокируют auto и все conversion hotkeys независимо от режима приложения."', '"Пауза временная. Защищённые поля блокируют автозамену и все горячие клавиши конвертации."')
          $text = $text.Replace('UiRect::new(24, 194, 852, 190)', 'UiRect::new(24, 194, 852, 210)')
          $text = $text.Replace('UiRect::new(44, 307, 386, 56)', 'UiRect::new(44, 307, 386, 76)')
