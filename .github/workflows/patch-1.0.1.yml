          $text = $text.Replace('UiRect::new(44, 423, 812, 20)', 'UiRect::new(44, 443, 812, 20)')
          $text = $text.Replace('UiRect::new(44, 447, 812, 32)', 'UiRect::new(44, 467, 812, 64)')
          $text = $text.Replace('UiRect::new(24, 506, 852, 190)', 'UiRect::new(24, 558, 852, 190)')
          $text = $text.Replace('UiRect::new(44, 533, 812, 20)', 'UiRect::new(44, 585, 812, 20)')
