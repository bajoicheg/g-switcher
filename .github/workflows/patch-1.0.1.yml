name: Patch G-switcher 1.0.1

on:
  push:
    branches:
      - fix/1.0.1-ui-lexicon
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/1.0.1-ui-lexicon

      - name: Apply patch
        shell: pwsh
        run: ./scripts/patch-1.0.1.ps1

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Commit patch
        shell: pwsh
        run: |
          git add Cargo.lock src/detector.rs src/windows_runtime/mod.rs src/windows_runtime/e2e_tests.rs src/windows_runtime/ui.rs src/windows_runtime/ui/settings_dialog.rs
          if (git diff --cached --quiet) {
            Write-Host 'Patch already applied.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply 1.0.1 detector and UI fixes'
          git push origin HEAD:fix/1.0.1-ui-lexicon
