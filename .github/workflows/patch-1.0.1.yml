name: Patch G-switcher 1.0.1

on:
  push:
    branches:
      - fix/1.0.1-ui-lexicon

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/1.0.1-ui-lexicon

      - name: Preserve ambiguous context test case
        shell: pwsh
        run: |
          $path = 'src/frequency_model.rs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('"привет мир система сервер', '"привет система сервер')
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8 -NoNewline

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Commit patch
        shell: pwsh
        run: |
          git add src/frequency_model.rs
          if (git diff --cached --quiet) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve context-sensitive short-word detection'
          git push origin HEAD:fix/1.0.1-ui-lexicon
