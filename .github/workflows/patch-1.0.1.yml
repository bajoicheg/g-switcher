          $text = $text.Replace('UiRect::new(190, 561, 190, 30)', 'UiRect::new(190, 613, 190, 30)')
          $text = $text.Replace('UiRect::new(462, 566, 156, 24)', 'UiRect::new(462, 618, 156, 24)')
          $text = $text.Replace('UiRect::new(626, 561, 230, 30)', 'UiRect::new(626, 613, 230, 30)')
          $text = $text.Replace('UiRect::new(44, 609, 140, 24)', 'UiRect::new(44, 661, 140, 24)')
          $text = $text.Replace('UiRect::new(190, 604, 190, 30)', 'UiRect::new(190, 656, 190, 30)')
          $text = $text.Replace('UiRect::new(462, 609, 156, 24)', 'UiRect::new(462, 661, 156, 24)')
          $text = $text.Replace('UiRect::new(626, 604, 230, 30)', 'UiRect::new(626, 656, 230, 30)')
          $text = $text.Replace('UiRect::new(44, 652, 140, 24)', 'UiRect::new(44, 704, 140, 24)')
          $text = $text.Replace('UiRect::new(190, 647, 190, 30)', 'UiRect::new(190, 699, 190, 30)')
          $text = $text.Replace('UiRect::new(420, 652, 436, 24)', 'UiRect::new(420, 704, 436, 24)')
