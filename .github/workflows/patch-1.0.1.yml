          $text = $text.Replace('UiRect::new(762, 706, 104, 34)', 'UiRect::new(762, 769, 104, 34)')

          $oldStyle = @'
    let mut style = WS_CHILD
        | WS_VISIBLE
        | WS_BORDER
        | WS_VSCROLL
        | ES_MULTILINE as u32
        | ES_AUTOVSCROLL as u32;
    if read_only {
        style |= ES_READONLY as u32;
    }
'@
          $newStyle = @'
    let mut style = WS_CHILD | WS_VISIBLE | WS_BORDER | ES_MULTILINE as u32 | ES_AUTOVSCROLL as u32;
    if read_only {
        style |= ES_READONLY as u32;
    } else {
        style |= WS_VSCROLL;
    }
'@
          if ($text.Contains($oldStyle)) {
            $text = $text.Replace($oldStyle, $newStyle)
          } elseif (-not $text.Contains('style |= WS_VSCROLL;')) {
            throw 'settings multiline style block not found'
          }
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8 -NoNewline

      - name: Format
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          cargo fmt --all

      - name: Commit patch
        shell: pwsh
        run: |
          git add Cargo.toml Cargo.lock build.rs scripts/release-check.ps1 .github/workflows/windows-ci.yml src/lib.rs src/detector.rs src/frequency_model.rs src/windows_runtime/mod.rs src/windows_runtime/e2e_tests.rs src/windows_runtime/ui.rs src/windows_runtime/ui/settings_dialog.rs
          if (git diff --cached --quiet) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix 1.0.1 UI layout and expand built-in lexicon'
          git push origin HEAD:fix/1.0.1-ui-lexicon
