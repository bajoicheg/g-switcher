name: Release G-switcher 1.0.8

on:
  workflow_run:
    workflows: ["Windows Rust CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    steps:
      - name: Skip if release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.8 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0

      - name: Download checked Windows artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g-switcher-1.0.8-windows-x64
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact hash
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $expected = ((Get-Content -LiteralPath release/g-switcher.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath release/g-switcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

      - name: Create v1.0.8 release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v1.0.8 `
            release/g-switcher.exe `
            release/g-switcher.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET_SHA `
            --title "G-switcher 1.0.8" `
            --notes "G-switcher 1.0.8 fixes the first-run UI and autostart-state regression reported in 1.0.7. The first-run information block now uses four explicit bounded lines in one native control so long Russian text cannot overlap the privacy line. Its autostart checkbox is initialized from the actual per-user Windows Run state, and the first-run choice is authoritative in both directions: clearing the checkbox now removes an existing G-switcher Run entry instead of silently leaving stale autostart enabled. First-run and Settings version labels now come from the package version rather than stale hard-coded strings, and the Settings title bar uses the G-switcher application icon. Detector and correction behavior are otherwise unchanged from 1.0.7: the full War and Peace audit remains 340,059/342,237 eligible wrong-layout Russian occurrences restored (99.3636%), with zero false automatic corrections across 342,237 checked correct Russian and 11,594 checked correct Latin-layout occurrences. Runtime remains local-only with no network or telemetry. The EXE is not Authenticode-signed; verify the attached SHA-256 before use."
