name: Apply ten-Wikipedia detector fixes

on:
  push:
    branches: [audit/wikipedia-ten-1.0.6]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary ten-corpus source promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-ten-1.0.6

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Patch corpus-derived source lexicons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/frequency_model.rs')
          text = path.read_text(encoding='utf-8')

          en_anchor = '    "hello world system server user security '
          en_replacement = '    "dyer ren ytd cnf lev hello world system server user security '
          if en_anchor not in text:
              raise SystemExit('EN_COMMON anchor not found')
          text = text.replace(en_anchor, en_replacement, 1)

          safe_words = (
              'автомат блоки ведут вещающих внутрь встреча выделен выучку герц герцшпрунга '
              'говорит голов гонтарук длин доступны европа здоров инструкцию интерференции кома '
              'крузенштерна куйбышеве культуру курляндскую кючук математика образ образов пешей почт '
              'продолжит прото реально росс русскую свободны семь скупку солнечная союз структурную '
              'тепе трук увеличив устройств уходит учеб физика чешку якуты '
          )
          ru_anchor = '    "привет система сервер пользователь безопасность '
          ru_replacement = '    "' + safe_words + 'привет система сервер пользователь безопасность '
          if ru_anchor not in text:
              raise SystemExit('RU_COMMON anchor not found')
          text = text.replace(ru_anchor, ru_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Linux source gate
        shell: bash
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add src/frequency_model.rs tests/wikipedia_ten_regressions.rs
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Apply ten-Wikipedia detector fixes'
          git push origin HEAD:audit/wikipedia-ten-1.0.6
