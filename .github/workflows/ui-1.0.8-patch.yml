name: Apply G-switcher 1.0.8 UI fixes

on:
  push:
    branches: [fix/ui-first-run-autostart-1.0.8]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ui-first-run-autostart-1.0.8
          fetch-depth: 0

      - name: Apply 1.0.8 source and UI fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(data.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              if old not in data:
                  raise SystemExit(f'{path}: marker not found: {old!r}')
              p.write_text(data.replace(old, new), encoding='utf-8')

          replace_once('Cargo.toml', 'version = "1.0.7"', 'version = "1.0.8"')
          replace_once('build.rs', 'resource.set("FileVersion", "1.0.7.0");', 'resource.set("FileVersion", "1.0.8.0");')
          replace_once('build.rs', 'resource.set("ProductVersion", "1.0.7");', 'resource.set("ProductVersion", "1.0.8");')
          replace_once('src/lib.rs', 'pub const PRODUCT_VERSION: &str = "1.0.7";', 'pub const PRODUCT_VERSION: &str = "1.0.8";')
          replace_all('scripts/release-check.ps1', '1.0.7', '1.0.8')

          replace_once(
              'src/windows_runtime/mod.rs',
              '''        let enable_autostart = ui::show_first_run()?;\n        if enable_autostart {\n            settings::set_autostart(true)?;\n        }\n        settings::mark_first_run_completed()?;''',
              '''        let enable_autostart = ui::show_first_run()?;\n        settings::set_autostart(enable_autostart)?;\n        settings::mark_first_run_completed()?;'''
          )

          replace_once(
              'src/windows_runtime/ui.rs',
              'const FIRST_RUN_CLASS: &str = "GSwitcher.FirstRun";',
              'const FIRST_RUN_CLASS: &str = concat!("GSwitcher.FirstRun.", env!("CARGO_PKG_VERSION"));'
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '        let title = wide("G-switcher — первый запуск");',
              '        let title = wide(concat!("G-switcher ", env!("CARGO_PKG_VERSION"), " — первый запуск"));'
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '    let title_text = wide("G-switcher");',
              '    let title_text = wide(concat!("G-switcher ", env!("CARGO_PKG_VERSION")));'
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '''    let description_text = wide(\n        "Исправляет слова, набранные в неверной русской или английской раскладке.\\r\\nРаботает полностью локально — без сети, облака и телеметрии.",\n    );\n    let description = CreateWindowExW(\n        0,\n        static_class.as_ptr(),\n        description_text.as_ptr(),\n        WS_CHILD | WS_VISIBLE | SS_LEFT_STYLE,\n        176,\n        82,\n        448,\n        58,\n        hwnd,\n        null_mut(),\n        module,\n        null(),\n    );\n\n    let privacy_text = wide("Набираемый текст не сохраняется на диск.");\n    let privacy = CreateWindowExW(\n        0,\n        static_class.as_ptr(),\n        privacy_text.as_ptr(),\n        WS_CHILD | WS_VISIBLE | SS_LEFT_STYLE,\n        176,\n        146,\n        448,\n        24,\n        hwnd,\n        null_mut(),\n        module,\n        null(),\n    );''',
              '''    let description_text = wide(\n        "Исправляет слова, набранные в неверной раскладке:\\r\\nрусской или английской.\\r\\nРаботает локально — без сети, облака и телеметрии.\\r\\nНабираемый текст не сохраняется на диск.",\n    );\n    let description = CreateWindowExW(\n        0,\n        static_class.as_ptr(),\n        description_text.as_ptr(),\n        WS_CHILD | WS_VISIBLE | SS_LEFT_STYLE,\n        176,\n        82,\n        448,\n        88,\n        hwnd,\n        null_mut(),\n        module,\n        null(),\n    );'''
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '    SendMessageW(checkbox, BM_SETCHECK, BST_CHECKED_VALUE as usize, 0);',
              '''    SendMessageW(\n        checkbox,\n        BM_SETCHECK,\n        usize::from(settings::autostart_enabled()) * BST_CHECKED_VALUE as usize,\n        0,\n    );'''
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '    let footer_text = wide("G-switcher © V. Vasilev 2026");',
              '    let footer_text = wide(concat!("G-switcher ", env!("CARGO_PKG_VERSION"), " © V. Vasilev 2026"));'
          )
          replace_once(
              'src/windows_runtime/ui.rs',
              '''        description,\n        privacy,\n        examples,''',
              '''        description,\n        examples,'''
          )

          replace_once(
              'src/windows_runtime/ui/settings_dialog.rs',
              'const CLASS_NAME: &str = "GSwitcher.Settings.1.0.7";',
              'const CLASS_NAME: &str = concat!("GSwitcher.Settings.", env!("CARGO_PKG_VERSION"));'
          )
          replace_once(
              'src/windows_runtime/ui/settings_dialog.rs',
              '''            hInstance: module,\n            hIcon: null_mut(),\n            hCursor: LoadCursorW(null_mut(), IDC_ARROW),''',
              '''            hInstance: module,\n            hIcon: super::load_app_icon(),\n            hCursor: LoadCursorW(null_mut(), IDC_ARROW),'''
          )
          replace_once(
              'src/windows_runtime/ui/settings_dialog.rs',
              '        "Настройки G-switcher 1.0.6",',
              '        concat!("Настройки G-switcher ", env!("CARGO_PKG_VERSION")),'
          )
          replace_once(
              'src/windows_runtime/ui/settings_dialog.rs',
              '        "Работает локально. Контекст: до 2 слов в RAM. Пароли, PIN и OTP не обрабатываются.",',
              '        "Работает локально. Контекст — до 2 слов только в RAM. Пароли, PIN и OTP не обрабатываются.",'
          )

          readme = Path('README.md').read_text(encoding='utf-8')
          old = '''Version 1.0.7 validates Detector v3 against the exact novel body of Tolstoy’s `War and Peace`. At true word boundaries it restores 340,059/342,237 eligible wrong-layout Russian occurrences (99.3636%) while producing zero false automatic corrections across 342,237 correct Russian and 11,594 correct Latin-layout occurrences in the same mixed Russian/French/German corpus.\n\n## 1.0.7 behavior'''
          new = '''Version 1.0.8 fixes first-run/autostart state synchronization and hardens the native first-run and Settings layouts. Detector v3 remains the 1.0.7 full-novel build: 340,059/342,237 eligible wrong-layout Russian occurrences restored (99.3636%) with zero false automatic corrections across 342,237 correct Russian and 11,594 correct Latin-layout occurrences in the mixed Russian/French/German `War and Peace` corpus.\n\n## 1.0.8 behavior'''
          if old not in readme:
              raise SystemExit('README current-version marker missing')
          readme = readme.replace(old, new, 1)
          old_bullet = '- The first-run window gets additional bottom space and a shorter Settings hint so the separator, autostart row and copyright footer remain visually separated.'
          if old_bullet not in readme:
              raise SystemExit('README first-run bullet missing')
          readme = readme.replace(old_bullet, '- The first-run description uses four explicit bounded lines in one control, preventing text overlap; its autostart checkbox reflects the actual Windows Run state.', 1)
          anchor = '- Read-only application-mode lists remain clean; the editable user dictionary keeps normal scrolling.\n'
          if anchor not in readme:
              raise SystemExit('README UI anchor missing')
          readme = readme.replace(anchor, '- Settings and first-run headings use the package version dynamically, and the Settings title bar uses the G-switcher application icon.\n- An unchecked first-run autostart choice now explicitly removes any existing G-switcher Run entry instead of leaving stale autostart enabled.\n' + anchor, 1)
          readme = readme.replace('G-switcher 1.0.7 version metadata', 'G-switcher 1.0.8 version metadata')
          Path('README.md').write_text(readme, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          entry = '''## 1.0.8 - 2026-09-04\n\n- Fixes first-run text overlap by replacing the fragile split description/privacy controls with four explicit bounded lines in one control.\n- Makes the first-run autostart choice authoritative in both directions: unchecked now removes an existing `HKCU\\...\\Run` entry instead of silently preserving it.\n- Initializes the first-run autostart checkbox from the actual Windows Run state, matching Settings.\n- Removes stale hard-coded Settings version text; first-run/Settings UI version labels now come from `CARGO_PKG_VERSION`.\n- Restores the G-switcher application icon in the Settings title bar and tightens the privacy subtitle wording.\n- Detector/runtime behavior from 1.0.7 is otherwise unchanged.\n\n'''
          if current.startswith('# Changelog\n\n'):
              current = '# Changelog\n\n' + entry + current[len('# Changelog\n\n'):]
          else:
              current = entry + current
          changelog.write_text(current, encoding='utf-8')

          trigger = Path('ui-1.0.8-trigger.txt')
          if trigger.exists():
              trigger.unlink()
          '@ | python -

      - name: Validate source candidate
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit source candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "Fix first-run UI and autostart state for 1.0.8"
          git push origin HEAD:fix/ui-first-run-autostart-1.0.8
