name: Normalize G-switcher 1.0.6 docs

on:
  push:
    branches: [audit/wikipedia-ten-1.0.6]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Add temporary 1.0.6 docs normalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-ten-1.0.6

      - name: Normalize current-spec version references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('docs').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('1.0.4', '1.0.6').replace('1.0.5', '1.0.6')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(path)
          PY
          if grep -R -n -E '1\.0\.[45]' docs; then
            echo 'stale version reference remains in current docs'
            exit 1
          fi

      - name: Commit normalized docs
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add docs
          git commit -m 'Normalize current documentation to G-switcher 1.0.6'
          git push origin HEAD:audit/wikipedia-ten-1.0.6
