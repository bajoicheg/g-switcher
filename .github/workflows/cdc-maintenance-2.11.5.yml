                dst_pkg = ADOPT / ".agents/skills/continuous-development-cycle"
                shutil.rmtree(dst_pkg)
                shutil.copytree(CANON / "src/continuous-development-cycle", dst_pkg, symlinks=True)

                # Consumer lock.
