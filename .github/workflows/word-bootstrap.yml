name: Word restart guard managed writer
'on':
  push:
    branches:
    - cdc/word-restart-host-20261009-1837
permissions:
  contents: read
concurrency:
  group: word-restart-guard-managed-writer
  cancel-in-progress: false
jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    permissions:
      contents: write
      actions: write
    env:
      CDC_REPO_ROOT: ${{ github.workspace }}/product
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
    - name: Checkout reviewed host controller
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        path: orchestration
        persist-credentials: false
    - name: Checkout exact managed base
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 10b7e90dfa9521170c48d9f09e2c5a4d6d77c3c3
        path: product
        fetch-depth: 0
        persist-credentials: true
    - name: Install host runtime dependencies
      run: 'python -m pip install PyYAML

        rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

        rustup target add --toolchain 1.98.1 x86_64-pc-windows-gnu

        sudo apt-get update -qq

        sudo apt-get install -y -qq gcc-mingw-w64-x86-64

        '
    - name: Start gated managed host and wait for exact bundle
      run: python -B orchestration/.g-switcher-bootstrap/host_step.py start
      env:
        PYTHONPYCACHEPREFIX: ${{ runner.temp }}/word-python-cache
    - name: Upload reconstructed exact candidate
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: word-exact-diagnostic-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/word-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/recovered
        if-no-files-found: error
        retention-days: 30
    - name: Await owned Windows validation and managed release
      run: python -B orchestration/.g-switcher-bootstrap/host_step.py wait
      env:
        PYTHONPYCACHEPREFIX: ${{ runner.temp }}/word-python-cache
    - name: Preserve authenticated managed lifecycle evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: word-bootstrap-protocol-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/word-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: warn
        retention-days: 30
