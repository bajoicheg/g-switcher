name: Apply Wikipedia corpus fixes v3

on:
  push:
    branches: [audit/wikipedia-five-1.0.5]
    paths: [.github/workflows/apply-wikipedia-fixes-v3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-five-1.0.5
          fetch-depth: 0

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Apply and validate corpus fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          words = "автоматически автор англ блок боукы будут бук бурундук быт верит вес взят видео включён вне вод встреч высоки гвт герцшпрунгу глав гольштейн групп дат доме доп дорог достиг дума женщин жэхэ задач игр идут имён интернешнл интерфакс интерфейс квт кгц книг кот кпк крк крупнейшее крупнейшей кук куклу курируют лев луны люфтваффе маршрут маршрутных маршруту маршруты мгц меня мест млн млрд москва москъвь мпк мужчин мыс над науку начал нефтиду норма нос носит образован основ ост отв пар перу плохо показа пол получит пор пот прав приносит приходит причин проблем просто проходит путей россия рук руках рус сбор свобод сего сей сил сильны слов слова служб смотре сост спб став ставит сторон стоя стоят стран страниц строит структур структуру структуры сферу тел теле термин термина трети трлн труд труду уверен уверенно удар улиц управ уход уча финал финляндскую форм фрукты цен час чел чувство школ эйнштейн эйнштейна якутскую"
          lexicon_words = words.replace("включён", "включен").replace("имён", "имен")

          model = Path('src/frequency_model.rs')
          text = model.read_text(encoding='utf-8')
          marker = '    "политик систем спрос программ лиц дел правил команд виде работ инструкции важны норм ",\n'
          addition = f'    "{lexicon_words} ",\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('RU_COMMON insertion marker not found')
              model.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')

          detector = Path('src/detector.rs')
          text = detector.read_text(encoding='utf-8')
          old = '    let source = infer_language(token)?;\n'
          new = '''    let source = match infer_language(token) {\n        Some(source) => source,\n        None => punctuation_only_known_target_source(token, user_words)?,\n    };\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('detector source-inference marker not found')
              text = text.replace(old, new, 1)

          helper_marker = 'fn confidence_from_scores(\n'
          helper = '''fn punctuation_only_known_target_source(\n    token: &str,\n    user_words: &[String],\n) -> Option<Language> {\n    if token.chars().count() < 3\n        || token\n            .chars()\n            .any(|ch| ch.is_ascii_alphanumeric() || is_ru_letter(ch) || ch.is_whitespace())\n    {\n        return None;\n    }\n\n    // A few Russian words can be typed entirely on OEM keys in the English\n    // layout (for example, жэхэ -> ;'['). Only admit this otherwise\n    // language-less shape when it maps to an already-known Russian target.\n    // This keeps arbitrary punctuation fail-open.\n    let source = Language::English;\n    let target = Language::Russian;\n    let mapped = opposite_layout_text(token, source);\n    if !candidate_shape_is_valid(&mapped, target) {\n        return None;\n    }\n    let normalized = normalize(&mapped, target);\n    let known_target = dictionary_contains(target, &normalized, user_words)\n        || frequency_model::word_score(target, &normalized) >= 15;\n    known_target.then_some(source)\n}\n\n'''
          if helper not in text:
              if helper_marker not in text:
                  raise SystemExit('detector helper insertion marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          detector.write_text(text, encoding='utf-8')

          cases = ',\n        '.join(f'"{word}"' for word in words.split())
          test = f"""use g_switcher::{{\n    detector::{{correction_with_context, DEFAULT_CONFIDENCE_THRESHOLD}},\n    frequency_model,\n    layout::opposite_layout_text,\n    model::Language,\n}};\n\nconst WIKIPEDIA_FIVE_REGRESSIONS: &[&str] = &[\n        {cases}\n];\n\n#[test]\nfn restores_safe_five_wikipedia_corpus_regressions() {{\n    let context = vec!["это".to_owned(), "текст".to_owned()];\n    for word in WIKIPEDIA_FIVE_REGRESSIONS {{\n        let wrong = opposite_layout_text(word, Language::Russian);\n        let source_score = frequency_model::word_score(Language::English, &wrong);\n        let detection = correction_with_context(\n            &wrong,\n            &[],\n            DEFAULT_CONFIDENCE_THRESHOLD,\n            &context,\n        );\n        if source_score >= 15 {{\n            assert!(\n                detection.is_none(),\n                "known English source must remain protected for {{word}} -> {{wrong}}"\n            );\n            continue;\n        }}\n        let detection = detection\n            .unwrap_or_else(|| panic!("did not restore {{word}} from {{wrong}}"));\n        assert_eq!(detection.source, Language::English, "wrong source for {{word}}");\n        assert_eq!(detection.target, Language::Russian, "wrong target for {{word}}");\n        assert_eq!(detection.corrected, *word, "wrong correction for {{word}}");\n        assert_eq!(detection.confidence, 100, "non-deterministic target {{word}}");\n    }}\n}}\n\n#[test]\nfn arbitrary_oem_punctuation_remains_unchanged() {{\n    for token in ["...", ";;;", "[]'", "'''", "```"] {{\n        assert!(\n            correction_with_context(token, &[], DEFAULT_CONFIDENCE_THRESHOLD, &[]).is_none(),\n            "unexpected punctuation correction for {{token}}"\n        );\n    }}\n}}\n"""
          Path('tests/wikipedia_five_regressions.rs').write_text(test, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --all-targets

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add src/frequency_model.rs src/detector.rs tests/wikipedia_five_regressions.rs
          git diff --cached --check
          git commit -m 'Fix five-Wikipedia corpus regressions for 1.0.5'
          git push origin HEAD:audit/wikipedia-five-1.0.5
