name: Windows Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify normalized 2.0.1 source
        if: github.head_ref == 'release/2.0.1' || github.ref_name == 'release/2.0.1'
        shell: pwsh
        run: |
          ./scripts/ci-normalize-v201.ps1
          ./scripts/safety-hardening-v201.ps1
          $changes = git status --porcelain
          if ($changes) {
            Write-Host '2.0.1 source is not reproducibly normalized. Commit these changes instead of letting CI mutate the branch:'
            git status --short
            git diff --check
            git diff -- Cargo.toml Cargo.lock src/windows_runtime_v201.rs src/windows_runtime/selection.rs src/windows_runtime/secure_input.rs src/windows_runtime/uia_secure.rs src/windows_runtime/uia_text.rs src/windows_runtime/runtime_dispatch.rs src/windows_runtime/cross_process_e2e.rs src/windows_runtime/e2e_tests.rs src/bin/g-switcher-e2e-helper.rs src/bin/g-switcher-failure-e2e.rs tests/browser_uia_adapter.rs
            throw 'Normalization changed tracked source.'
          }

      - name: Format
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Unit tests
        shell: pwsh
        run: cargo test --locked --all-targets

      - name: Manual compatibility tooling smoke test
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
            throw 'Windows PowerShell 5.1 executable is missing from the runner.'
          }

          $recorderBytes = [System.IO.File]::ReadAllBytes('scripts/manual-compatibility-v201.ps1')
          if (@($recorderBytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw 'manual-compatibility-v201.ps1 must remain ASCII-only for Windows PowerShell 5.1 compatibility.'
          }

          $output = Join-Path $env:RUNNER_TEMP "compatibility-results-2.0.1.md"
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\manual-compatibility-v201.ps1 -ScaffoldOnly -OutputPath $output
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 recorder smoke test failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'Manual compatibility recorder did not create its result file.'
          }
          $text = Get-Content -LiteralPath $output -Raw
          if ($text -notmatch '## Manual application matrix' -or $text -notmatch 'Notepad' -or $text -notmatch 'Windows Terminal' -or $text -notmatch 'PENDING') {
            throw 'Manual compatibility recorder produced an incomplete scaffold.'
          }

          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-compatibility-v201.ps1 -Path $output
          if ($LASTEXITCODE -eq 0) {
            throw 'Compatibility verifier unexpectedly accepted a PENDING scaffold.'
          }
          $global:LASTEXITCODE = 0

          $valid = @'
          # G-switcher 2.0.1 - compatibility verifier fixture

          ## Manual application matrix

          | Application | Version tested | Windows build | Auto | Manual current word | Selected text | Undo | Password/sensitive fields | Result / notes |
          |---|---|---|---|---|---|---|---|---|
          | Notepad | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A | fixture |
          | Microsoft Word | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A | fixture |
          | Microsoft Edge | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS | fixture |
          | Google Chrome | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS | fixture |
          | Telegram Desktop | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A | fixture |
          | Visual Studio Code | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | N/A | fixture |
          | Windows Terminal | 1.0.0 | 26100 | UNSUPPORTED/FAIL-OPEN | UNSUPPORTED/FAIL-OPEN | UNSUPPORTED/FAIL-OPEN | N/A | N/A | fixture |

          ## End fixture
          '@
          $validPath = Join-Path $env:RUNNER_TEMP "compatibility-valid-2.0.1.md"
          Set-Content -LiteralPath $validPath -Value $valid -Encoding UTF8
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-compatibility-v201.ps1 -Path $validPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Compatibility verifier rejected a complete non-blocking matrix.'
          }

          $invalidBrowser = $valid.Replace(
            '| Microsoft Edge | 1.0.0 | 26100 | PASS | PASS | PASS | PASS | PASS |',
            '| Microsoft Edge | 1.0.0 | 26100 | UNSUPPORTED/FAIL-OPEN | PASS | PASS | PASS | PASS |'
          )
          $invalidBrowserPath = Join-Path $env:RUNNER_TEMP "compatibility-invalid-browser-2.0.1.md"
          Set-Content -LiteralPath $invalidBrowserPath -Value $invalidBrowser -Encoding UTF8
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-compatibility-v201.ps1 -Path $invalidBrowserPath
          if ($LASTEXITCODE -eq 0) {
            throw 'Compatibility verifier unexpectedly accepted unsupported Edge core behavior.'
          }
          $global:LASTEXITCODE = 0

          $invalidCore = $valid.Replace(
            '| Notepad | 1.0.0 | 26100 | PASS |',
            '| Notepad | 1.0.0 | 26100 | N/A |'
          )
          $invalidCorePath = Join-Path $env:RUNNER_TEMP "compatibility-invalid-core-2.0.1.md"
          Set-Content -LiteralPath $invalidCorePath -Value $invalidCore -Encoding UTF8
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-compatibility-v201.ps1 -Path $invalidCorePath
          if ($LASTEXITCODE -eq 0) {
            throw 'Compatibility verifier unexpectedly accepted N/A for a core text-operation column.'
          }
          $global:LASTEXITCODE = 0

          $invalidMetadata = $valid.Replace(
            '| Microsoft Word | 1.0.0 | 26100 |',
            '| Microsoft Word | UNKNOWN | 26100 |'
          )
          $invalidMetadataPath = Join-Path $env:RUNNER_TEMP "compatibility-invalid-metadata-2.0.1.md"
          Set-Content -LiteralPath $invalidMetadataPath -Value $invalidMetadata -Encoding UTF8
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-compatibility-v201.ps1 -Path $invalidMetadataPath
          if ($LASTEXITCODE -eq 0) {
            throw 'Compatibility verifier unexpectedly accepted UNKNOWN application metadata.'
          }
          $global:LASTEXITCODE = 0

      - name: Build cross-process E2E helper
        shell: pwsh
        run: cargo build --locked --bin g-switcher-e2e-helper

      - name: Windows same-process E2E
        shell: pwsh
        run: cargo test --locked --lib real_windows_hook_to_edit_e2e -- --ignored --test-threads=1 --nocapture

      - name: Windows cross-process E2E
        shell: pwsh
        run: |
          $env:G_SWITCHER_E2E_HELPER = (Resolve-Path "target/debug/g-switcher-e2e-helper.exe").Path
          cargo test --locked --lib real_cross_process_edit_e2e_release_gate -- --ignored --test-threads=1 --nocapture

      - name: Real Edge and Chrome UIA adapter E2E
        shell: pwsh
        run: cargo test --locked --test browser_uia_adapter -- --ignored --test-threads=1 --nocapture

      - name: Windows hung and closing target E2E
        shell: pwsh
        run: |
          $env:G_SWITCHER_E2E_HELPER = (Resolve-Path "target/debug/g-switcher-e2e-helper.exe").Path
          cargo run --locked --bin g-switcher-failure-e2e

      - name: Clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        shell: pwsh
        run: cargo build --locked --release --bin g-switcher

      - name: Release and branding checks
        shell: pwsh
        run: ./scripts/release-check.ps1

      - name: Prepare public release package
        shell: pwsh
        run: |
          $packageRoot = "target/release/g-switcher-2.0.1"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -LiteralPath target/release/g-switcher.exe -Destination $packageRoot
          Copy-Item -LiteralPath target/release/g-switcher.exe.sha256 -Destination $packageRoot
          Copy-Item -LiteralPath README.md -Destination $packageRoot
          Copy-Item -LiteralPath CHANGELOG.md -Destination $packageRoot
          Copy-Item -LiteralPath RELEASE_NOTES_2.0.1.md -Destination $packageRoot
          Copy-Item -LiteralPath THIRD_PARTY_DATA.md -Destination $packageRoot
          Copy-Item -LiteralPath COMPATIBILITY_2.0.1.md -Destination $packageRoot
          $zip = "target/release/g-switcher-2.0.1-windows-x64.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  g-switcher-2.0.1-windows-x64.zip" -Encoding ascii -NoNewline

      - name: Prepare manual compatibility kit
        shell: pwsh
        run: |
          $kitRoot = "target/manual-compatibility/g-switcher-2.0.1"
          New-Item -ItemType Directory -Path $kitRoot -Force | Out-Null
          Copy-Item -LiteralPath target/release/g-switcher.exe -Destination $kitRoot
          Copy-Item -LiteralPath target/release/g-switcher.exe.sha256 -Destination $kitRoot
          Copy-Item -LiteralPath scripts/manual-compatibility-v201.ps1 -Destination $kitRoot
          Copy-Item -LiteralPath scripts/verify-compatibility-v201.ps1 -Destination $kitRoot
          Copy-Item -LiteralPath COMPATIBILITY_2.0.1.md -Destination $kitRoot
          Copy-Item -LiteralPath MANUAL_TESTING_2.0.1.md -Destination $kitRoot

      - name: Upload checked Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g-switcher-2.0.1-windows-x64
          path: |
            target/release/g-switcher.exe
            target/release/g-switcher.exe.sha256
            target/release/g-switcher-2.0.1-windows-x64.zip
            target/release/g-switcher-2.0.1-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload manual compatibility kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g-switcher-2.0.1-manual-compatibility-kit
          path: target/manual-compatibility/g-switcher-2.0.1
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g-switcher-2.0.1-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
