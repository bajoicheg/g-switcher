name: Patch G-switcher 1.0.3 fix

on:
  push:
    branches: ["fix/1.0.3-korobochka"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/1.0.3-korobochka
          fetch-depth: 1
      - name: Apply fix
        shell: pwsh
        run: ./scripts/patch-1.0.3-fix.ps1
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_runtime/mod.rs src/frequency_model.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Retry partial SendInput delivery"
          git push origin HEAD:fix/1.0.3-korobochka
