name: Apply 1.0.4 corpus fixes

on:
  push:
    branches: ["feature/1.0.4-wikipedia-corpus"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/1.0.4-wikipedia-corpus
          fetch-depth: 1

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Apply and format
        shell: pwsh
        run: ./scripts/apply-1.0.4-corpus-fixes.ps1

      - name: Commit source fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/detector.rs src/windows_runtime/mod.rs src/layout.rs src/lib.rs src/expanded_lexicon.rs
          git commit -m "Apply corpus-driven detector and OEM fixes"
          git push origin HEAD:feature/1.0.4-wikipedia-corpus
