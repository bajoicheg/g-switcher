name: Patch 1.0 modifier restoration

on:
  push:
    branches:
      - feature/1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/1.0.0

      - name: Patch queued modifier restoration
        shell: pwsh
        run: |
          $path = 'src/windows_runtime/mod.rs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          if ($text.Contains('let active_modifiers = Modifiers {')) {
            Write-Host 'Modifier restoration is already patched.'
            exit 0
          }

          $old = @'
                  let mut inputs = Vec::new();
                  append_modifier_releases(&mut inputs, pending.held_modifiers);
                  append_backspaces(&mut inputs, pending.erase_len);
          '@
          $new = @'
                  let active_modifiers = Modifiers {
                      ctrl: pending.held_modifiers.ctrl && is_control_down(),
                      shift: pending.held_modifiers.shift && is_shift_down(),
                      alt: pending.held_modifiers.alt && is_alt_down(),
                  };
                  let mut inputs = Vec::new();
                  append_modifier_releases(&mut inputs, active_modifiers);
                  append_backspaces(&mut inputs, pending.erase_len);
          '@

          if (-not $text.Contains($old)) {
            throw 'Expected queued-correction input block was not found.'
          }
          $text = $text.Replace($old, $new)
          $oldRestore = 'append_modifier_presses(&mut inputs, pending.held_modifiers);'
          if (-not $text.Contains($oldRestore)) {
            throw 'Expected modifier restore call was not found.'
          }
          $text = $text.Replace($oldRestore, 'append_modifier_presses(&mut inputs, active_modifiers);')
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline

      - name: Format
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt
          rustup default stable
          cargo fmt --all

      - name: Commit patch
        shell: pwsh
        run: |
          git add src/windows_runtime/mod.rs
          if (git diff --cached --quiet) {
            Write-Host 'No patch to commit.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix queued modifier restoration'
          git push origin HEAD:feature/1.0.0
