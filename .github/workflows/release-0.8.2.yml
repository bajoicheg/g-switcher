name: Release G-switcher 0.8.2

on:
  workflow_run:
    workflows: ["Windows Rust CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    steps:
      - name: Skip if release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.8.2 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0

      - name: Download checked Windows artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g-switcher-0.8.2-windows-x64
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact hash
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $expected = ((Get-Content -LiteralPath release/g-switcher.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath release/g-switcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

      - name: Create v0.8.2 release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v0.8.2 `
            release/g-switcher.exe `
            release/g-switcher.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET_SHA `
            --title "G-switcher 0.8.2" `
            --notes "Settings UI patch release. Redesigns the native Settings window with DPI-safe sizing, clear General/Application modes/User dictionary/Hotkeys sections, balanced application-mode columns, a 2x2 hotkey grid, shorter non-overlapping hints, and a dedicated Save/Cancel footer. Runtime correction behavior and the local-only privacy model are unchanged. The EXE is not Authenticode-signed; verify the attached SHA-256 before use."
