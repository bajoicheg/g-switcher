name: Finalize G-switcher 1.0.10 frequency release

on:
  push:
    branches:
      - feature/frequency-lexicon-1.0.10

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/frequency-lexicon-1.0.10
          fetch-depth: 0

      - name: Update release documentation
        shell: pwsh
        run: python tools/finalize_1_0_10_docs.py

      - name: Validate final 1.0.10 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          cargo fmt --all
          if (Test-Path Cargo.lock) { Remove-Item Cargo.lock }
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo test --lib real_windows_hook_to_edit_e2e -- --ignored --test-threads=1 --nocapture
          cargo clippy --all-targets -- -D warnings
          cargo build --release --bin g-switcher
          ./scripts/release-check.ps1
          if ((Get-Content Cargo.toml -Raw) -notmatch 'version = "1\.0\.10"') { throw 'Cargo version mismatch' }
          if ((Get-Content src/lib.rs -Raw) -notmatch 'PRODUCT_VERSION: &str = "1\.0\.10"') { throw 'Product version mismatch' }
          if ((Get-Content build.rs -Raw) -notmatch 'FileVersion", "1\.0\.10\.0"') { throw 'Windows FileVersion mismatch' }
          git diff --check

      - name: Commit final non-workflow candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path Cargo.lock) { Remove-Item Cargo.lock }
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Document G-switcher 1.0.10 frequency release"
          git push origin HEAD:feature/frequency-lexicon-1.0.10
