name: Apply final ten-Wikipedia detector fixes

on:
  push:
    branches: [audit/wikipedia-ten-1.0.6]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add final ten-corpus source promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-ten-1.0.6

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Patch final safe corpus forms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/frequency_model.rs')
          text = model.read_text(encoding='utf-8')
          anchor = 'привет система сервер пользователь безопасность'
          replacement = 'культур культ евро математик физик ' + anchor
          if anchor not in text:
              raise SystemExit('RU_COMMON final anchor not found')
          text = text.replace(anchor, replacement, 1)
          model.write_text(text, encoding='utf-8')

          test = Path('tests/wikipedia_ten_regressions.rs')
          text = test.read_text(encoding='utf-8')
          marker = '    "якуты",\n];'
          replacement = '    "якуты",\n    "культур",\n    "культ",\n    "евро",\n    "математик",\n    "физик",\n];'
          if marker not in text:
              raise SystemExit('SAFE_CORRECTIONS marker not found')
          text = text.replace(marker, replacement, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Linux source gate
        shell: bash
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit final source fixes
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add src/frequency_model.rs tests/wikipedia_ten_regressions.rs
          git commit -m 'Apply final ten-Wikipedia detector fixes'
          git push origin HEAD:audit/wikipedia-ten-1.0.6
