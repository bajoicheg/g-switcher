name: Publication Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publication-audit.yml'
      - 'scripts/security/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: publication-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all publicly advertised heads, tags and pull-request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/audit/pull/*/head' '+refs/pull/*/merge:refs/audit/pull/*/merge'
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          cd "$RUNNER_TEMP/gitleaks-bin"
          base='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          echo '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae  checksums.txt' | sha256sum --check --strict
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          ./gitleaks version
      - name: Test scanner redaction and archive handling
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Audit reachable Git objects, discussions, releases, logs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security/publication_audit.py --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/audit-redacted" --remote
      - name: Upload redacted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-audit-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-redacted/publication-audit-redacted.json
          if-no-files-found: warn
          retention-days: 7
