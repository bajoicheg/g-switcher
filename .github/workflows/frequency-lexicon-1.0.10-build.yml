name: Build G-switcher 1.0.10 frequency lexicon

on:
  push:
    branches: [feature/frequency-lexicon-1.0.10]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/frequency-lexicon-1.0.10
          fetch-depth: 0

      - name: Generate pinned everyday frequency forms
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import csv
          import io
          import re
          import urllib.request

          SOURCE_COMMIT = "b5ff7d0d26df0863b9b6c5e8f946961ea9fef1f3"
          BASE = f"https://raw.githubusercontent.com/kapzam123/subtitle-frequency/{SOURCE_COMMIT}/top_words"
          SOURCE_LIMIT = 30000

          EN_TO_RU = dict(zip(
              "qwertyuiop[]asdfghjkl;'zxcvbnm,.",
              "йцукенгшщзхъфывапролджэячсмитьбю",
          ))
          RU_TO_EN = {v: k for k, v in EN_TO_RU.items()}
          EN_TO_RU['`'] = 'ё'
          RU_TO_EN['ё'] = '`'

          def download(language):
              url = f"{BASE}/{language}_top_words.csv"
              with urllib.request.urlopen(url, timeout=60) as response:
                  return response.read().decode("utf-8-sig")

          def clean_word(language, value):
              value = value.strip().lower()
              if language == "ru":
                  value = value.replace("ё", "е")
                  return value if re.fullmatch(r"[а-я]+", value) and len(value) >= 3 else None
              return value if re.fullmatch(r"[a-z]+", value) and len(value) >= 3 else None

          def load(language):
              text = download(language)
              rows = list(csv.DictReader(io.StringIO(text)))
              forms = {}
              for raw_rank, row in enumerate(rows, start=1):
                  word = clean_word(language, row["word"])
                  if word is None:
                      continue
                  count = int(row["count"])
                  if word in forms:
                      old_rank, old_count = forms[word]
                      forms[word] = (min(old_rank, raw_rank), old_count + count)
                  else:
                      forms[word] = (raw_rank, count)
              return forms, len(rows)

          ru, ru_rows = load("ru")
          en, en_rows = load("en")

          ru_source = {w: rc for w, rc in ru.items() if rc[0] <= SOURCE_LIMIT}
          en_source = {w: rc for w, rc in en.items() if rc[0] <= SOURCE_LIMIT}

          def target_limit(word):
              n = len(word)
              if n == 3:
                  return 3000
              if n == 4:
                  return 10000
              return 15000

          def target_eligible(word, rank):
              return rank <= target_limit(word)

          def wrong_layout(language, word):
              table = RU_TO_EN if language == "ru" else EN_TO_RU
              return "".join(table.get(ch, ch) for ch in word)

          def generated_module():
              def render(name, forms):
                  lines = [f"pub const {name}: &[(&str, u16)] = &["]
                  for word, (rank, _count) in sorted(forms.items()):
                      lines.append(f'    ("{word}", {rank}),')
                  lines.append("];")
                  return "\n".join(lines)

              return f'''// @generated by the G-switcher 1.0.10 frequency-lexicon build.
// Source: OpenSubtitles2018 word-form frequencies mirrored at
// https://github.com/kapzam123/subtitle-frequency, pinned to {SOURCE_COMMIT}.
// Original frequency data: CC BY 3.0. See THIRD_PARTY_DATA.md.
//
// The source-protection layer keeps the first 30,000 corpus rows per language.
// Automatic target promotion is deliberately narrower: ranks <= 3,000 for
// 3-letter forms, <= 10,000 for 4-letter forms, and <= 15,000 for 5+ letters.

use crate::model::Language;

pub const SOURCE_FORM_RANK_LIMIT: u16 = {SOURCE_LIMIT};

{render("RU_FORMS", ru_source)}

{render("EN_FORMS", en_source)}

pub fn forms(language: Language) -> &'static [(&'static str, u16)] {{
    match language {{
        Language::Russian => RU_FORMS,
        Language::English => EN_FORMS,
    }}
}}

pub fn rank(language: Language, token: &str) -> Option<u16> {{
    let table = forms(language);
    table
        .binary_search_by(|(word, _)| (*word).cmp(token))
        .ok()
        .map(|index| table[index].1)
}}

pub fn target_eligible(word: &str, rank: u16) -> bool {{
    let limit = match word.chars().count() {{
        0..=2 => 0,
        3 => 3_000,
        4 => 10_000,
        _ => 15_000,
    }};
    rank <= limit
}}

pub fn target_word_score(language: Language, token: &str) -> i32 {{
    rank(language, token)
        .filter(|rank| target_eligible(token, *rank))
        .map(|_| 15)
        .unwrap_or(0)
}}

pub fn source_word_score(language: Language, token: &str) -> i32 {{
    rank(language, token).map(|_| 15).unwrap_or(0)
}}

pub fn has_target_prefix(language: Language, prefix: &str) -> bool {{
    if prefix.is_empty() {{
        return false;
    }}
    let table = forms(language);
    let start = table.partition_point(|(word, _)| *word < prefix);
    table[start..]
        .iter()
        .take_while(|(word, _)| word.starts_with(prefix))
        .any(|(word, rank)| target_eligible(word, *rank) && word.len() > prefix.len())
}}
'''

          Path("src/frequent_forms.rs").write_text(generated_module(), encoding="utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/lib.rs",
              "pub mod detector;\npub mod frequency_model;",
              "pub mod detector;\nmod frequent_forms;\npub mod frequency_model;",
          )

          replace_once(
              "src/frequency_model.rs",
              "use crate::model::Language;",
              "use crate::{frequent_forms, model::Language};",
          )

          old_word_score = '''pub fn word_score(language: Language, token: &str) -> i32 {
    let (top, common) = match language {
        Language::English => (EN_TOP, EN_COMMON),
        Language::Russian => (RU_TOP, RU_COMMON),
    };

    if let Some(index) = words(top).position(|word| word == token) {
        return match index {
            0..=19 => 26,
            20..=49 => 23,
            50..=79 => 20,
            _ => 17,
        };
    }
    if contains_word(common, token) {
        return 15;
    }
    0
}
'''
          new_word_score = '''pub fn word_score(language: Language, token: &str) -> i32 {
    let curated = curated_word_score(language, token);
    if curated > 0 {
        return curated;
    }
    frequent_forms::target_word_score(language, token)
}

pub fn source_word_score(language: Language, token: &str) -> i32 {
    let curated = curated_word_score(language, token);
    if curated > 0 {
        return curated;
    }
    frequent_forms::source_word_score(language, token)
}

fn curated_word_score(language: Language, token: &str) -> i32 {
    let (top, common) = match language {
        Language::English => (EN_TOP, EN_COMMON),
        Language::Russian => (RU_TOP, RU_COMMON),
    };

    if let Some(index) = words(top).position(|word| word == token) {
        return match index {
            0..=19 => 26,
            20..=49 => 23,
            50..=79 => 20,
            _ => 17,
        };
    }
    if contains_word(common, token) {
        return 15;
    }
    0
}
'''
          replace_once("src/frequency_model.rs", old_word_score, new_word_score)

          old_prefix = '''    words(top)
        .chain(words(common))
        .any(|word| word.starts_with(token) && word.len() > token.len())
}'''
          new_prefix = '''    words(top)
        .chain(words(common))
        .any(|word| word.starts_with(token) && word.len() > token.len())
        || frequent_forms::has_target_prefix(language, token)
}'''
          replace_once("src/frequency_model.rs", old_prefix, new_prefix)

          replace_once(
              "src/detector.rs",
              "let source_frequency = frequency_model::word_score(source, &normalized);",
              "let source_frequency = frequency_model::source_word_score(source, &normalized);",
          )

          detector_anchor = '''    #[test]\n    fn corrects_known_wrong_layout_words() {'''
          detector_test = '''    #[test]\n    fn generated_frequent_forms_are_source_safe_and_target_covered() {\n        let mut protected_sources = 0usize;\n        let mut promoted_targets = 0usize;\n        let mut intentional_collisions = 0usize;\n        let mut code_safe_skips = 0usize;\n\n        for target in [Language::Russian, Language::English] {\n            for &(word, rank) in crate::frequent_forms::forms(target) {\n                assert!(\n                    frequency_model::source_word_score(target, word) >= 15,\n                    "frequent source form is not protected: {word}"\n                );\n                protected_sources += 1;\n\n                if !crate::frequent_forms::target_eligible(word, rank) {\n                    continue;\n                }\n\n                let wrong = opposite_layout_text(word, target);\n                if is_code_safe_token(&wrong) {\n                    code_safe_skips += 1;\n                    continue;\n                }\n\n                let source = opposite(target);\n                let normalized_source = normalize(&wrong, source);\n                if frequency_model::source_word_score(source, &normalized_source) >= 15 {\n                    intentional_collisions += 1;\n                    assert!(\n                        correction_at_boundary_with_context(\n                            &wrong,\n                            &[],\n                            DEFAULT_CONFIDENCE_THRESHOLD,\n                            &[],\n                        )\n                        .is_none(),\n                        "frequent cross-language source collision must stay fail-open: {wrong} -> {word}"\n                    );\n                    continue;\n                }\n\n                let detection = correction_at_boundary_with_context(\n                    &wrong,\n                    &[],\n                    DEFAULT_CONFIDENCE_THRESHOLD,\n                    &[],\n                )\n                .unwrap_or_else(|| panic!("frequent target form was not corrected: {wrong} -> {word}"));\n                assert_eq!(detection.target, target);\n                assert_eq!(normalize(&detection.corrected, target), word);\n                assert_eq!(detection.confidence, 100);\n                promoted_targets += 1;\n            }\n        }\n\n        assert!(protected_sources > 40_000);\n        assert!(promoted_targets > 15_000);\n        eprintln!(\n            "frequency lexicon: protected_sources={protected_sources}, promoted_targets={promoted_targets}, intentional_collisions={intentional_collisions}, code_safe_skips={code_safe_skips}"\n        );\n    }\n\n    #[test]\n    fn common_frequency_wordforms_are_deterministic() {\n        for (word, language) in [\n            ("мама", Language::Russian),\n            ("мыла", Language::Russian),\n            ("раму", Language::Russian),\n            ("знаешь", Language::Russian),\n            ("хочешь", Language::Russian),\n            ("сказала", Language::Russian),\n            ("домой", Language::Russian),\n            ("wanted", Language::English),\n            ("looking", Language::English),\n            ("friends", Language::English),\n            ("mother", Language::English),\n        ] {\n            assert!(frequency_model::word_score(language, word) >= 15, "missing frequent form: {word}");\n            let wrong = opposite_layout_text(word, language);\n            let source = opposite(language);\n            let normalized_source = normalize(&wrong, source);\n            if frequency_model::source_word_score(source, &normalized_source) >= 15 {\n                continue;\n            }\n            let detection = correction_at_boundary_with_context(\n                &wrong,\n                &[],\n                DEFAULT_CONFIDENCE_THRESHOLD,\n                &[],\n            )\n            .unwrap_or_else(|| panic!("frequent form did not restore: {wrong} -> {word}"));\n            assert_eq!(normalize(&detection.corrected, language), word);\n        }\n    }\n\n    #[test]\n    fn corrects_known_wrong_layout_words() {'''
          replace_once("src/detector.rs", detector_anchor, detector_test)

          e2e_anchor = '''    eprintln!("G-switcher E2E checkpoint: boundary prefix completion");'''
          e2e_test = '''    eprintln!("G-switcher E2E checkpoint: frequent everyday wordforms");\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"PYFTIM "),\n        "знаешь ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"LJVJQ "),\n        "домой ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"VFIBYF "),\n        "машина ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::Russian,\n        &keys(b"WANTED "),\n        "wanted ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::Russian,\n        &keys(b"LOOKING "),\n        "looking ",\n    );\n\n    eprintln!("G-switcher E2E checkpoint: boundary prefix completion");'''
          replace_once("src/windows_runtime/e2e_tests.rs", e2e_anchor, e2e_test)

          def metrics(language, forms, source):
              clean_total = sum(count for _word, (_rank, count) in forms.items())
              source_total = sum(count for _word, (_rank, count) in source.items())
              promoted = {w: rc for w, rc in source.items() if target_eligible(w, rc[0])}
              promoted_total = sum(count for _word, (_rank, count) in promoted.items())
              return clean_total, source_total, promoted, promoted_total

          ru_clean, ru_source_mass, ru_promoted, ru_promoted_mass = metrics("ru", ru, ru_source)
          en_clean, en_source_mass, en_promoted, en_promoted_mass = metrics("en", en, en_source)

          def collisions(language, promoted, other_source):
              result = []
              for word, (rank, count) in promoted.items():
                  wrong = wrong_layout(language, word)
                  other = clean_word("en" if language == "ru" else "ru", wrong)
                  if other and other in other_source:
                      result.append((rank, word, wrong, other_source[other][0], count))
              return sorted(result)[:100]

          ru_collisions = collisions("ru", ru_promoted, en_source)
          en_collisions = collisions("en", en_promoted, ru_source)

          probes_ru = ["мама", "мыла", "раму", "знаешь", "хочешь", "сказала", "домой", "машина", "работу", "детей"]
          probes_en = ["mother", "wanted", "looking", "friends", "home", "children", "worked", "going", "please", "sorry"]

          def probe_lines(forms, words):
              out = []
              for word in words:
                  data = forms.get(word)
                  out.append(f"- `{word}`: rank {data[0]:,}" if data else f"- `{word}`: not in pinned top-30k")
              return "\n".join(out)

          def pct(a, b):
              return 100.0 * a / b if b else 0.0

          collision_preview = "\n".join(
              f"- RU `{word}` ↔ EN source `{wrong}` (RU rank {rank}, EN rank {other_rank})"
              for rank, word, wrong, other_rank, _count in ru_collisions[:20]
          )
          collision_preview += "\n" + "\n".join(
              f"- EN `{word}` ↔ RU source `{wrong}` (EN rank {rank}, RU rank {other_rank})"
              for rank, word, wrong, other_rank, _count in en_collisions[:20]
          )

          report = f'''# G-switcher 1.0.10 frequency lexicon audit

Generated from the OpenSubtitles2018 surface-form frequency lists mirrored by `kapzam123/subtitle-frequency`, pinned to commit `{SOURCE_COMMIT}`. The original frequency data is CC BY 3.0.

The purpose of this layer is everyday **word-form** coverage, not lemmatized vocabulary. OpenCorpora's current downloadable corpus/frequency lists and the Lyashevskaya–Sharoff/NKRYa frequency dictionary were used as independent Russian-frequency references during design; they are not copied into the generated runtime tables.

## Selection policy

- Source protection: every normalized alphabetic form whose raw source rank is <= {SOURCE_LIMIT:,}; this is deliberately broad.
- Automatic target promotion: rank <= 3,000 for 3-letter forms, <= 10,000 for 4-letter forms, <= 15,000 for 5+ letter forms.
- Russian `ё` is normalized to `е`, matching the detector's existing normalization.
- Tokens shorter than 3 letters and non-alphabetic rows are excluded because automatic correction already ignores them or treats them as special input.
- If a target's physical wrong-layout spelling is itself a frequent source form in the opposite language, source protection wins and the case stays fail-open.
- Global confidence thresholds are unchanged.

## Pinned corpus statistics

| Metric | Russian | English |
| --- | ---: | ---: |
| Raw CSV rows | {ru_rows:,} | {en_rows:,} |
| Clean unique >=3-letter forms | {len(ru):,} | {len(en):,} |
| Embedded source-protection forms | {len(ru_source):,} | {len(en_source):,} |
| Target-promoted forms before collision/code-safe gates | {len(ru_promoted):,} | {len(en_promoted):,} |
| Source-layer token mass within clean pinned list | {pct(ru_source_mass, ru_clean):.4f}% | {pct(en_source_mass, en_clean):.4f}% |
| Target-promotion token mass within clean pinned list | {pct(ru_promoted_mass, ru_clean):.4f}% | {pct(en_promoted_mass, en_clean):.4f}% |
| Frequent cross-layout collisions kept fail-open | {len(ru_collisions):,} | {len(en_collisions):,} |

## Everyday probes — Russian

{probe_lines(ru, probes_ru)}

## Everyday probes — English

{probe_lines(en, probes_en)}

## Highest-frequency cross-layout collisions

{collision_preview or '- none'}

The exhaustive Rust regression checks every embedded source form for preservation and every promoted target form for deterministic restoration unless it is an explicit source collision or protected code-like token. Real Win32 E2E additionally exercises representative RU and EN wordforms through the low-level keyboard hook and `SendInput` path.
'''
          Path("docs/FREQUENCY_LEXICON_1_0_10.md").write_text(report, encoding="utf-8")

          attribution = f'''# Third-party data attribution

## OpenSubtitles2018 word-form frequency data

G-switcher 1.0.10 includes a generated, filtered frequency table derived from the Russian and English word-form frequency lists in `kapzam123/subtitle-frequency`, pinned to commit `{SOURCE_COMMIT}`. That repository mirrors data derived from OpenSubtitles2018.

Original data license: Creative Commons Attribution 3.0 (CC BY 3.0). Source repository: https://github.com/kapzam123/subtitle-frequency . Original project attribution: OpenSubtitles / OpenSubtitles2018.

G-switcher stores only normalized word forms and their source ranks needed for local detector decisions. No subtitle text, sentences, counts, or network retrieval code is shipped in the runtime executable.
'''
          Path("THIRD_PARTY_DATA.md").write_text(attribution, encoding="utf-8")
          '@ | python -

      - name: Validate generated detector
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          cargo fmt --all
          if (Test-Path Cargo.lock) { Remove-Item Cargo.lock }
          cargo fmt --all -- --check
          cargo test --all-targets -- --nocapture
          cargo test --lib real_windows_hook_to_edit_e2e -- --ignored --test-threads=1 --nocapture
          cargo clippy --all-targets -- -D warnings
          git diff --check

      - name: Commit validated generated lexicon
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (Test-Path Cargo.lock) { Remove-Item Cargo.lock }
          git add src/frequent_forms.rs src/lib.rs src/frequency_model.rs src/detector.rs src/windows_runtime/e2e_tests.rs docs/FREQUENCY_LEXICON_1_0_10.md THIRD_PARTY_DATA.md
          git diff --cached --check
          git commit -m "Add broad safe frequency word-form lexicon"
          git push origin HEAD:feature/frequency-lexicon-1.0.10
