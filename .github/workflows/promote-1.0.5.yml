name: Promote G-switcher 1.0.5

on:
  push:
    branches: [audit/wikipedia-five-1.0.5]
    paths: [.github/workflows/promote-1.0.5.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/wikipedia-five-1.0.5
          fetch-depth: 0

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Promote source and release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('Cargo.toml', 'version = "1.0.4"', 'version = "1.0.5"', 1)
          replace('build.rs', 'resource.set("FileVersion", "1.0.4.0");', 'resource.set("FileVersion", "1.0.5.0");', 1)
          replace('build.rs', 'resource.set("ProductVersion", "1.0.4");', 'resource.set("ProductVersion", "1.0.5");', 1)
          replace('src/lib.rs', 'pub const PRODUCT_VERSION: &str = "1.0.4";', 'pub const PRODUCT_VERSION: &str = "1.0.5";', 1)
          replace('scripts/release-check.ps1', "if ($version.FileVersion -ne '1.0.4.0')", "if ($version.FileVersion -ne '1.0.5.0')", 1)
          replace('scripts/release-check.ps1', "if ($version.ProductVersion -ne '1.0.4')", "if ($version.ProductVersion -ne '1.0.5')", 1)
          replace('src/windows_runtime/ui/settings_dialog.rs', 'GSwitcher.Settings.1.0.4', 'GSwitcher.Settings.1.0.5')
          replace('src/windows_runtime/ui/settings_dialog.rs', 'G-switcher 1.0.4', 'G-switcher 1.0.5')
          replace('.github/workflows/windows-ci.yml', 'g-switcher-1.0.4-windows-x64', 'g-switcher-1.0.5-windows-x64', 1)

          e2e = Path('src/windows_runtime/e2e_tests.rs')
          text = e2e.read_text(encoding='utf-8')
          old_import = '    KEYBDINPUT, KEYEVENTF_KEYUP, VK_BACK, VK_CONTROL, VK_OEM_2, VK_OEM_3, VK_OEM_COMMA,\n    VK_OEM_PERIOD, VK_RETURN, VK_SHIFT, VK_SPACE, VK_TAB,\n'
          new_import = '    KEYBDINPUT, KEYEVENTF_KEYUP, VK_BACK, VK_CONTROL, VK_OEM_1, VK_OEM_2, VK_OEM_3, VK_OEM_4,\n    VK_OEM_7, VK_OEM_COMMA, VK_OEM_PERIOD, VK_RETURN, VK_SHIFT, VK_SPACE, VK_TAB,\n'
          if old_import not in text:
              raise SystemExit('E2E OEM import marker not found')
          text = text.replace(old_import, new_import, 1)
          marker = '''    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"BYCNHERWBB "),\n        "инструкции ",\n    );\n'''
          addition = marker + '''    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &[\n            key(VK_OEM_1 as u8),\n            key(VK_OEM_7 as u8),\n            key(VK_OEM_4 as u8),\n            key(VK_OEM_7 as u8),\n            key(VK_SPACE as u8),\n        ],\n        "жэхэ ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"KEYS "),\n        "keys ",\n    );\n    run_case(\n        window,\n        edit,\n        ui_thread_id,\n        Language::English,\n        &keys(b"HER "),\n        "her ",\n    );\n'''
          if marker not in text:
              raise SystemExit('E2E insertion marker not found')
          e2e.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_para = 'Version 1.0.4 improves Detector v3 coverage using a synthetic wrong-layout corpus derived from a long Russian information-security article. The audit isolated 13 residual common Russian word forms under Normal sensitivity; all are now deterministic local target recognition while the 1.0.3 partial-`SendInput` reliability fix remains unchanged.'
          new_para = 'Version 1.0.5 expands Detector v3 validation across five large Russian Wikipedia articles (Russia, Moscow, World War II, Internet and Universe). The final synthetic RU→EN wrong-layout corpus contains 23,336 unique testable word forms: 23,332 are automatically restored, while four occurrences are deliberately preserved because their wrong-layout strings are valid English source words (`keys`/`her`).'
          if old_para not in text:
              raise SystemExit('README version paragraph marker not found')
          text = text.replace(old_para, new_para, 1)
          text = text.replace('## 1.0.4 behavior', '## 1.0.5 behavior', 1)
          old_bullet = '- Article-corpus regression coverage includes the common Russian forms `политик`, `систем`, `спрос`, `программ`, `лиц`, `дел`, `правил`, `команд`, `виде`, `работ`, `инструкции`, `важны` and `норм`.'
          new_bullet = '- Five-Wikipedia corpus regression coverage adds 151 corpus-derived Russian forms and explicitly preserves genuine EN/RU source collisions such as `keys` ↔ `луны` and `her` ↔ `рук`.'
          if old_bullet not in text:
              raise SystemExit('README corpus bullet marker not found')
          text = text.replace(old_bullet, new_bullet, 1)
          text = text.replace('G-switcher 1.0.4 version metadata', 'G-switcher 1.0.5 version metadata', 1)
          old_e2e = 'and article-derived `cbcntv` → `систем`, `ghjuhfvv` → `программ`, and `bycnherwbb` → `инструкции` cases.'
          new_e2e = 'and article-derived `cbcntv` → `систем`, `ghjuhfvv` → `программ`, `bycnherwbb` → `инструкции`, OEM-only `;\'[` + "'" + ' → `жэхэ`, plus `keys`/`her` source-collision protection.'
          if old_e2e not in text:
              raise SystemExit('README E2E marker not found')
          text = text.replace(old_e2e, new_e2e, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 1.0.5 — 2026-09-04\n\n- Audits Detector v3 against five large Russian Wikipedia articles: `Россия`, `Москва`, `Вторая мировая война`, `Интернет` and `Вселенная`. After normalization and intentional ALL-CAPS/code-safe exclusions, the corpus contains 23,336 unique testable Russian word forms.\n- Improves automatic restoration from 23,105/23,336 (99.0101%) to 23,332/23,336 (99.9829%). The remaining four occurrences are deliberate source-language protections: `луны` maps to valid English `keys` three times and `рук` maps to valid English `her` once.\n- Adds 151 corpus-derived regression forms, including final gaps `нефти`, `наук` and `сфер`, without lowering global confidence thresholds.\n- Adds a narrow OEM-only detector fallback so a punctuation-looking token such as `;\'[` + "'" + ' can become `жэхэ` only when its physical RU mapping is an already-known target word; arbitrary punctuation remains fail-open.\n- Adds real Win32 hook→EDIT E2E coverage for `жэхэ` and anti-regressions preserving valid English `keys` and `her`.\n- Updates package, Windows/UI metadata, CI artifact naming, release checks and gated release automation to 1.0.5.\n\n'''
          if not text.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG header marker not found')
          changelog.write_text('# Changelog\n\n' + entry + text[len('# Changelog\n\n'):], encoding='utf-8')
          PY

          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git diff --check

      - name: Commit promoted 1.0.5 source
        shell: bash
        run: |
          git config user.name 'g-switcher-ci'
          git config user.email 'g-switcher-ci@users.noreply.github.com'
          git add Cargo.toml build.rs src/lib.rs scripts/release-check.ps1 src/windows_runtime/ui/settings_dialog.rs src/windows_runtime/e2e_tests.rs .github/workflows/windows-ci.yml README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'Promote five-Wikipedia fixes to G-switcher 1.0.5'
          git push origin HEAD:audit/wikipedia-five-1.0.5
