name: Repository Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/2.0.1']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-and-privacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          cd "$RUNNER_TEMP/gitleaks-bin"
          base='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          echo '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae  checksums.txt' | sha256sum --check --strict
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          ./gitleaks version
      - name: Scanner unit tests
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Prove credential detectors remain enabled
        run: python3 scripts/security/verify_secret_rules.py
      - name: Scan complete fetched history for secrets
        run: gitleaks git . --config .gitleaks.toml --log-opts=--all --max-decode-depth=2 --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
      - name: Scan current files and archives for secrets
        run: gitleaks dir . --config .gitleaks.toml --max-decode-depth=2 --max-archive-depth=3 --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
      - name: Block private material and corporate references in tracked files
        run: python3 scripts/security/repository_hygiene.py
      - name: Resolve publication-audit candidates and retry transient gaps
        if: always() && github.head_ref == 'security/publication-audit' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT: ${{ runner.temp }}/triage-redacted
        run: |
          git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/audit/pull/*/head' '+refs/pull/*/merge:refs/audit/pull/*/merge'
          python3 scripts/security/triage_publication.py
      - name: Upload redacted triage evidence only
        if: always() && github.head_ref == 'security/publication-audit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-triage-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/triage-redacted/triage-redacted.json
          if-no-files-found: warn
          retention-days: 7
