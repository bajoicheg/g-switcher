[package]
name = "g-switcher"
version = "1.0.4"
edition = "2021"
authors = ["V. Vasilev"]
description = "Local Russian/English keyboard layout correction utility for Windows"
publish = false

[dependencies]
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
